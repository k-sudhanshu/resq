default:
  risk_level: URGENT
  summary: >-
    पूरी तरह जाग रहे हों तो अभी मीठा दें। ऊँघ रहे हों या निगल न सकें तो मदद
    बुलाएँ — ज़बरदस्ती खाना-पानी न डालें।
  emergency:
    call_112: false
    call_108: false
  immediate_actions:
    - step: 1
      title: जाग रहे हों तो चीनी दें
      instruction: >-
        3–4 चम्मच चीनी पानी में, एक गिलास जूस, या कुछ मिठाई दें। 10 मिनट रुकें। सुधरें तो हल्का नाश्ता दें।
    - step: 2
      title: सुरक्षित बैठाएँ
      instruction: >-
        ऐसे बैठाएँ या लिटाएँ कि गिर न सकें। साथ रहें।
    - step: 3
      title: अभी इंसुलिन न दें
      instruction: >-
        डॉक्टर बिना अतिरिक्त इंसुलिन या शुगर की गोली न दें — शुगर और गिर सकती है।
    - step: 4
      title: जाँच कराएँ
      instruction: >-
        बेहतर लगें तब भी उसी दिन डॉक्टर को दिखाएँ। आम दवाई और आखिरी खाना बताएँ।
  do_not:
    - ऊँघते व्यक्ति के मुँह में चीनी या पानी न डालें।
    - “सेफ़्टी” के लिए अतिरिक्त इंसुलिन न दें।
    - शुगर गिरने के बाद अकेले न छोड़ें।
  monitor:
    - पसीना, काँपना, कंफ़्यूज़न लौटना
    - जागकर निगल सकते हैं या नहीं
    - गहरी सांस या मुँह से मीठी गंध
  medical_follow_up:
    required: true
    reason: >-
      शुगर गिरना और बढ़ना दोनों जल्दी ख़तरनाक हो सकते हैं। मात्रा और तरल डॉक्टर देखें।
  sources:
    - nhs_first_aid
    - mohfw_india

critical:
  risk_level: CRITICAL
  summary: >-
    सुरक्षित निगल नहीं सकते या बेहोश हैं। 112 या 108 पर कॉल करें। मुँह में कुछ
    न डालें। सांस चल रही हो तो करवट लिटाएँ।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: अभी मदद बुलाएँ
      instruction: >-
        112 या 108 पर कॉल करें और कहें शुगर की आपात स्थिति है।
    - step: 2
      title: मुँह से कुछ नहीं
      instruction: >-
        पूरी तरह जाग न रहे हों तो चीनी, पानी, गोली कुछ न दें।
    - step: 3
      title: करवट
      instruction: >-
        सांस चल रही हो तो करवट लिटाएँ ताकि सांस खुली रहे।
    - step: 4
      title: मेडिकल कार्ड देखें
      instruction: >-
        बटुआ या फ़ोन में शुगर कार्ड हो तो एम्बुलेंस को बताएँ।
    - step: 5
      title: ज़रूरत हो तो सीपीआर
      instruction: >-
        सामान्य सांस न हो तो छाती दबाएँ।
  do_not:
    - मुँह में उंगली, चीनी, या चम्मच न डालें।
    - इंसुलिन न दें।
    - पीने के लिए मजबूर न करें।
  monitor:
    - सांस
    - आवाज़ पर जवाब
    - रंग और पसीना
  medical_follow_up:
    required: true
    reason: >-
      बेहोशी वाली कम शुगर या ऊँघ के साथ बहुत ऊँची शुगर का इलाज अस्पताल में होता है।
  sources:
    - nhs_first_aid
    - mohfw_india
