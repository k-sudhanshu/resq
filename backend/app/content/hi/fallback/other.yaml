default:
  risk_level: URGENT
  summary: >-
    हम अभी आपके विवरण का विश्लेषण नहीं कर पाए। नीचे दिए सामान्य फ़र्स्ट-एड क़दम
    अपनाएं और डॉक्टर की सलाह लें।
  emergency:
    call_112: false
    call_108: false
  immediate_actions:
    - step: 1
      title: पहले ख़तरा देखें
      instruction: >-
        मदद करने से पहले देख लें कि जगह आपके लिए सुरक्षित है — ट्रैफ़िक, आग, बिजली,
        पानी या केमिकल।
    - step: 2
      title: होश और सांस जांचें
      instruction: >-
        मरीज़ से बात करें और कंधा थपथपाएं। 10 सेकंड तक देखें और सुनें कि सांस सामान्य
        चल रही है या नहीं।
    - step: 3
      title: गंभीर लगे तो मदद बुलाएं
      instruction: >-
        अगर वह जवाब नहीं दे रहा, सांस लेने में तकलीफ़ है, तेज़ खून बह रहा है, या दौरे
        पड़ रहे हैं, तो 112 या 108 पर कॉल करें।
    - step: 4
      title: आराम से और स्थिर रखें
      instruction: >-
        उसे आराम की स्थिति में बैठाएं या लिटाएं, गरम रखें, और बेवजह हिलाएं-डुलाएं
        नहीं।
    - step: 5
      title: डॉक्टर की सलाह लें
      instruction: >-
        उसे डॉक्टर या अस्पताल ले जाएं, ख़ासकर अगर हालत बिगड़ रही है या आपको पक्का
        पता नहीं है।
  do_not:
    - अपने मन से कोई दवा न दें।
    - घाव या जली जगह पर घरेलू नुस्ख़े न लगाएं।
    - सुस्त मरीज़ को कुछ खाने या पीने को न दें।
    - किसी तक पहुंचने के लिए ख़ुद को ख़तरे में न डालें।
  monitor:
    - होश का स्तर, और मरीज़ जागता रहता है या नहीं
    - सांस मुश्किल, तेज़ या आवाज़ वाली होना
    - नया खून बहना, तेज़ दर्द, या हालत बिगड़ना
  medical_follow_up:
    required: true
    reason: >-
      ठीक जांच के बिना यह तय नहीं हो सकता कि क्या इलाज चाहिए, इसलिए डॉक्टर से
      जांच करवाना ज़रूरी है।
  sources:
    - nhs_first_aid
    - indian_red_cross

critical:
  risk_level: CRITICAL
  summary: >-
    आपने जो बताया, उसके हिसाब से तुरंत आपातकालीन मदद चाहिए। अभी 112 या 108 पर कॉल
    करें।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: तुरंत मदद बुलाएं
      instruction: >-
        अभी 112 या 108 पर कॉल करें। फ़ोन स्पीकर पर लगा लें ताकि आपके हाथ खाली रहें।
    - step: 2
      title: ख़तरा देखें, फिर होश जांचें
      instruction: >-
        पहले देखें कि पास जाना सुरक्षित है। फिर मरीज़ से बात करें और कंधा थपथपाकर
        देखें कि वह जवाब देता है या नहीं।
    - step: 3
      title: सांस जांचें
      instruction: >-
        10 सेकंड तक देखें और सुनें कि सांस सामान्य चल रही है या नहीं। अगर नहीं, तो
        छाती दबाना (CPR) शुरू करें।
    - step: 4
      title: बेहोश मरीज़ को करवट पर लिटाएं
      instruction: >-
        अगर वह बेहोश है पर सांस सामान्य चल रही है, तो उसे करवट पर लिटा दें ताकि सांस
        की नली खुली रहे।
    - step: 5
      title: उसके साथ रहें
      instruction: >-
        उसे गरम रखें, बात करते रहें, और मदद आने तक उसके पास ही रहें।
  do_not:
    - अपने मन से कोई दवा न दें।
    - सुस्त या बेहोश मरीज़ को कुछ खाने या पीने को न दें।
    - जब तक ख़तरा न हो, उसे हिलाएं नहीं।
    - जानकारी ढूंढने में समय लगाकर मदद बुलाना न टालें।
  monitor:
    - मरीज़ होश में है और जवाब दे पा रहा है या नहीं
    - सांस, और वह रुकना या आवाज़ वाली होना
    - त्वचा पीली, स्लेटी या नीली पड़ना
  medical_follow_up:
    required: true
    reason: >-
      कारण पता करने और इलाज शुरू करने के लिए अस्पताल में तुरंत जांच ज़रूरी है।
  sources:
    - nhs_first_aid
    - indian_red_cross
