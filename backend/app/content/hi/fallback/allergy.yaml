default:
  risk_level: URGENT
  summary: >-
    सुरक्षित हो तो कारण हटाएँ। सांस पर नज़र रखें। फैलते दाने या काटने के बाद
    चक्कर आए तो जल्दी इलाज चाहिए।
  emergency:
    call_112: false
    call_108: false
  immediate_actions:
    - step: 1
      title: कारण रोकें
      instruction: >-
        कीड़े, खाने, या दवाई से दूर करें। डंक दिखे तो कार्ड से बग़ल में खुरचें — न दबाएँ।
    - step: 2
      title: सांस भारी हो तो बैठाएँ
      instruction: >-
        सीना कसा हो तो बैठाकर थोड़ा आगे झुकाएँ। चक्कर आए तो लिटाकर पैर ऊँचे करें।
    - step: 3
      title: काट या दाने ठंडे करें
      instruction: >-
        ठंडे गीले कपड़े से राहत मिल सकती है। मिट्टी, तेल, या टूथपेस्ट न लगाएँ।
    - step: 4
      title: डॉक्टर से सलाह लें
      instruction: >-
        दाने फैल रहे हों, चेहरा सूजा हो, या बिच्छू हो तो उसी दिन डॉक्टर को दिखाएँ।
  do_not:
    - बिना मात्रा जाने बची-खुची एलर्जी की गोली न दें।
    - काट के ऊपर बहुत कसकर पट्टी न बाँधें।
    - सांस में थोड़ा भी फ़र्क लगे तो घर पर इंतज़ार न करें।
  monitor:
    - सांस, घरघराहट, गला कसना
    - होंठ, जीभ, चेहरा सूजना
    - चक्कर या फैलते दाने
  medical_follow_up:
    required: true
    reason: >-
      एलर्जी पहले घंटे के बाद और बढ़ सकती है। एड्रेनालिन चाहिए या नहीं डॉक्टर तय करेंगे।
  sources:
    - nhs_first_aid
    - indian_red_cross

critical:
  risk_level: CRITICAL
  summary: >-
    मुँह सूजना या सांस की दिक्कत एनाफाइलैक्सिस है। अभी 112 या 108। एड्रेनालिन
    पेन हो तो लगाएँ।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: अभी मदद बुलाएँ
      instruction: >-
        112 या 108 पर कॉल करें और कहें गंभीर एलर्जी है।
    - step: 2
      title: एड्रेनालिन पेन हो तो लगाएँ
      instruction: >-
        जाँघ के बाहरी मध्य भाग में कपड़ों के ऊपर भी लगा सकते हैं। पेन पर लिखा समय दबाएँ। 5 मिनट में फ़र्क न हो और दूसरा पेन हो तो दोहराएँ।
    - step: 3
      title: स्थिति
      instruction: >-
        सांस भारी हो तो बैठाएँ। चक्कर आए तो लिटाकर पैर ऊँचे करें। खड़ा या चलने न दें।
    - step: 4
      title: सुरक्षित हो तो कारण हटाएँ
      instruction: >-
        दिखता डंक खुरचें। ढूँढने में कॉल देर न करें।
    - step: 5
      title: सीपीआर के लिए तैयार
      instruction: >-
        जवाब न दें और सांस सामान्य न हो तो छाती दबाएँ।
  do_not:
    - खाना-पानी न दें।
    - चक्कर में सिर के नीचे तकिया न रखें — शॉक बढ़ सकता है।
    - सांस ख़राब हो तो दाने का इंतज़ार न करें।
  monitor:
    - सांस और आवाज़ (भारी आवाज़ चेतावनी है)
    - होंठ का रंग
    - जाग रहे हैं या नहीं
  medical_follow_up:
    required: true
    reason: >-
      पहला पेन लगने के बाद भी प्रतिक्रिया लौट सकती है। बेहतर दिखें तब भी अस्पताल जाएँ।
  sources:
    - nhs_first_aid
    - indian_red_cross
