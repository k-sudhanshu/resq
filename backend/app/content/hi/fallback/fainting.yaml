# Structure must mirror content/en/fallback/fainting.yaml exactly.
# Only the display text is translated.
default:
  risk_level: URGENT
  summary: >-
    मरीज़ को सीधा लिटाकर पैर ऊपर उठा दें। ज़्यादातर बेहोशी एक-दो मिनट में उतर जाती
    है, फिर भी वजह जानने के लिए डॉक्टर को दिखाना ज़रूरी है।
  emergency:
    call_112: false
    call_108: false
  immediate_actions:
    - step: 1
      title: लिटाएं, पैर ऊपर करें
      instruction: >-
        मरीज़ को पीठ के बल सीधा लिटा दें और पैर तकिये, बैग या अपने हाथ पर ऊपर उठा
        दें। इससे खून वापस दिमाग़ तक पहुंचता है।
    - step: 2
      title: हवा दें, कपड़े ढीले करें
      instruction: >-
        भीड़ हटा दें, खिड़कियां खोल दें, और कसा कॉलर या बेल्ट ढीला कर दें।
    - step: 3
      title: धीरे-धीरे संभलने दें
      instruction: >-
        होश आने पर कुछ मिनट लेटा रहने दें, फिर धीरे से बैठाएं। जल्दी खड़े होने से
        दोबारा बेहोशी आ सकती है।
    - step: 4
      title: पूरा होश आने पर कुछ पिलाएं
      instruction: >-
        पूरी तरह होश में आने पर घूंट-घूंट पानी, ओआरएस, या लंबे समय से कुछ न खाया
        हो तो कुछ मीठा दें।
    - step: 5
      title: वजह की जांच कराएं
      instruction: >-
        वजह जानने के लिए डॉक्टर से मिलें — ख़ासकर बुज़ुर्गों, गर्भवती महिलाओं,
        डायबिटिक मरीज़ों में, या कसरत के दौरान बेहोशी हुई हो तो।
  do_not:
    - होश लाने के लिए चेहरे पर पानी न छिड़कें और थप्पड़ न मारें।
    - पूरा होश आने से पहले कुछ खिलाएं-पिलाएं नहीं।
    - मरीज़ को झटके से खड़ा न करें।
    - उसके चारों ओर भीड़ न लगाएं — उसे हवा चाहिए।
  monitor:
    - एक-दो मिनट में पूरा होश आ रहा है या नहीं
    - बार-बार बेहोशी, सीने में दर्द, या धड़कन तेज़ लगना
    - गिरने से कोई चोट, ख़ासकर सिर पर
  medical_follow_up:
    required: true
    reason: >-
      बेहोशी की कई वजहें होती हैं — शुगर कम होना, पानी की कमी, धड़कन की गड़बड़ी।
      वजह डॉक्टर को ढूंढनी चाहिए, ख़ासकर बार-बार हो तो।
  sources:
    - nhs_first_aid
    - indian_red_cross

critical:
  risk_level: CRITICAL
  summary: >-
    जो मरीज़ होश में नहीं आ रहा या जिसकी सांस सामान्य नहीं है, उसे अभी आपातकालीन
    मदद चाहिए। 112 या 108 पर कॉल करें और इंतज़ार में उसकी सांस की नली खुली रखें।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: तुरंत मदद बुलाएं
      instruction: >-
        अभी 112 या 108 पर कॉल करें। फ़ोन स्पीकर पर रखें ताकि हाथ खाली रहें।
    - step: 2
      title: सांस देखें
      instruction: >-
        सिर हल्के से पीछे झुकाकर 10 सेकंड तक सांस को देखें, सुनें और महसूस करें।
    - step: 3
      title: सांस चल रही हो — करवट लिटाएं
      instruction: >-
        सांस चल रही हो, तो मरीज़ को करवट लिटा दें और सिर हल्का पीछे झुका रहने दें,
        ताकि सांस की नली खुली रहे।
    - step: 4
      title: सांस न चले — छाती दबाना शुरू करें
      instruction: >-
        सांस न चल रही हो या बस हांफ रहा हो, तो छाती के बीच में ज़ोर से और तेज़
        दबाएं — क़रीब हर सेकंड में दो बार — और मदद आने तक रुकें नहीं।
    - step: 5
      title: साथ रहें, दोबारा जांचें
      instruction: >-
        मरीज़ के पास रहें और एंबुलेंस आने तक हर मिनट सांस दोबारा जांचते रहें।
  do_not:
    - कुछ खाने या पीने को न दें।
    - मरीज़ को अकेला न छोड़ें।
    - पीठ के बल बेहोश मरीज़ के सिर के नीचे तकिया न लगाएं।
  monitor:
    - सांस — सामान्य बनी हुई है या नहीं
    - आवाज़ या छूने पर मरीज़ कोई जवाब देता है या नहीं
    - दौरे जैसे झटके या उल्टी
  medical_follow_up:
    required: true
    reason: >-
      लंबी बेहोशी की वजह स्ट्रोक, दिल की बीमारी, शुगर कम होना या ज़हर हो सकती है —
      इन सबका इलाज अस्पताल में ही है।
  sources:
    - nhs_first_aid
    - indian_red_cross
