# Structure must mirror content/en/fallback/seizure.yaml exactly.
# Only the display text is translated.
default:
  risk_level: URGENT
  summary: >-
    मरीज़ को चोट से बचाएं और दौरे को गुज़रने दें — उसे पकड़कर रोकें नहीं और मुंह
    में कुछ न डालें। दौरा रुकने पर करवट लिटाएं और पूरा होश आने तक साथ रहें।
  emergency:
    call_112: false
    call_108: false
  immediate_actions:
    - step: 1
      title: चोट से बचाएं
      instruction: >-
        आस-पास की सख़्त या नुकीली चीज़ें हटा दें। सिर के नीचे कुछ नरम रखें, जैसे तह
        किया कपड़ा या बैग।
    - step: 2
      title: दौरे का समय देखें
      instruction: >-
        कब शुरू हुआ, यह नोट कर लें। ज़्यादातर दौरे 2 से 3 मिनट में अपने आप रुक जाते
        हैं।
    - step: 3
      title: रुकने पर करवट लिटाएं
      instruction: >-
        मरीज़ को करवट लिटा दें ताकि लार बाहर निकल जाए और सांस साफ़ चलती रहे। गले के
        पास का कसा कपड़ा ढीला कर दें।
    - step: 4
      title: पूरा होश आने तक साथ रहें
      instruction: >-
        दौरे के बाद उलझन और नींद आना सामान्य है। पास रहें, शांति से बात करें, और
        पूरा होश आने तक कुछ खिलाएं-पिलाएं नहीं।
    - step: 5
      title: डॉक्टर को बताएं
      instruction: >-
        मरीज़ के डॉक्टर को दौरे के बारे में बताएं — दवा की मात्रा बदलनी पड़ सकती
        है। दौरा कितनी देर चला, यह लिख लें।
  do_not:
    - मरीज़ को पकड़कर झटके रोकने की कोशिश न करें।
    - मुंह में चम्मच, कपड़ा, उंगली या कोई भी चीज़ न डालें।
    - प्याज़ या जूता सुंघाने से कुछ नहीं होता — यह न करें।
    - पूरा होश आने से पहले खाना, पानी या दवा न दें।
  monitor:
    - दौरा कितनी देर चलता है — 5 मिनट से ज़्यादा हो तो इमरजेंसी है
    - दूसरा दौरा शुरू होता है या नहीं
    - दौरे के बाद सांस और होंठों का रंग
  medical_follow_up:
    required: true
    reason: >-
      हर दौरे की जानकारी डॉक्टर को देनी चाहिए, ताकि इलाज ठीक किया जा सके और वजह
      पता चले।
  sources:
    - nhs_first_aid
    - indian_red_cross

critical:
  risk_level: CRITICAL
  summary: >-
    5 मिनट से लंबा दौरा, बार-बार दौरे, ख़तरे के लक्षणों वाला पहला दौरा, या पानी
    में पड़ा दौरा — यह इमरजेंसी है। अभी 112 या 108 पर कॉल करें।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: तुरंत मदद बुलाएं
      instruction: >-
        अभी 112 या 108 पर कॉल करें। बताएं कि दौरा कितनी देर से चल रहा है। फ़ोन
        स्पीकर पर रखें।
    - step: 2
      title: सिर बचाते रहें
      instruction: >-
        झटके चलते रहें तो सख़्त चीज़ें दूर रखें और सिर के नीचे कुछ नरम रखे रहें।
    - step: 3
      title: मौक़ा मिलते ही करवट लिटाएं
      instruction: >-
        झटके थमते ही मरीज़ को करवट लिटा दें, ताकि लार और उल्टी से सांस की नली बंद
        न हो।
    - step: 4
      title: दौरे के बाद सांस जांचें
      instruction: >-
        दौरा रुकने पर सांस देखें। सांस न चल रही हो, तो छाती के बीच में ज़ोर से और
        तेज़ दबाना शुरू करें, और मदद आने तक जारी रखें।
    - step: 5
      title: साथ रहें और जानकारी दें
      instruction: >-
        पास रहें, हर दौरे का समय नोट करें, और जो देखा वह एंबुलेंस टीम को ठीक-ठीक
        बताएं।
  do_not:
    - मुंह में या दांतों के बीच कुछ भी न डालें।
    - झटके रोकने के लिए शरीर को दबाकर न पकड़ें।
    - दौरे के दौरान या तुरंत बाद खाना, पानी या दवा न दें।
    - मरीज़ पर पानी न डालें।
  monitor:
    - दौरा रुकता है या दोबारा शुरू होता है
    - सांस और होंठों का रंग
    - दौरे के बाद मरीज़ जवाब देने लगता है या नहीं
  medical_follow_up:
    required: true
    reason: >-
      लंबे या बार-बार दौरे दिमाग़ को नुक़सान पहुंचा सकते हैं, और इन्हें रोकने की
      आपातकालीन दवाएं सिर्फ़ अस्पताल में होती हैं।
  sources:
    - nhs_first_aid
    - indian_red_cross
