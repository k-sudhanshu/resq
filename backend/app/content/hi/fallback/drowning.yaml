# Structure must mirror content/en/fallback/drowning.yaml exactly.
# Only the display text is translated.
default:
  risk_level: URGENT
  summary: >-
    मरीज़ ठीक लगे, तब भी फेफड़ों में गया पानी घंटों बाद परेशानी कर सकता है। उसे
    गरम रखें, सांस पर नज़र रखें, और उसी दिन डॉक्टर से जांच कराएं।
  emergency:
    call_112: false
    call_108: false
  immediate_actions:
    - step: 1
      title: सुरक्षित तरीक़े से बाहर निकालें
      instruction: >-
        लाठी, रस्सी या कपड़ा बढ़ाकर खींचें, या कोई तैरने वाली चीज़ फेंकें। पानी में
        तभी उतरें जब आप अच्छे तैराक हों और यह सुरक्षित हो।
    - step: 2
      title: खांसकर पानी निकालने दें
      instruction: >-
        खांसना अच्छा है — इससे सांस की नली साफ़ होती है। उसे थोड़ा बैठाकर खांसने
        दें। पानी निकालने के लिए पेट न दबाएं।
    - step: 3
      title: गीले कपड़े उतारें, गरम रखें
      instruction: >-
        गीले कपड़े उतारकर सूखे कपड़े या कंबल में लपेट दें, सिर भी ढकें।
    - step: 4
      title: सांस पर नज़र रखें
      instruction: >-
        पास रहें और देखें — सांस तेज़ होना, खांसी न रुकना, या असामान्य थकान।
    - step: 5
      title: आज ही डॉक्टर को दिखाएं
      instruction: >-
        मरीज़ बिलकुल ठीक लगे, तब भी उसी दिन डॉक्टर से जांच कराएं — फेफड़ों की
        परेशानी घंटों बाद उभर सकती है।
  do_not:
    - मरीज़ को उल्टा न लटकाएं और पानी निकालने के लिए पेट न दबाएं।
    - घटना के बाद पहले कुछ घंटे उसे अकेला न छोड़ें।
    - गरमाने के नाम पर शराब या बहुत गरम पेय न दें।
  monitor:
    - अगले घंटों में सांस तेज़ या आवाज़दार होना
    - खांसी जो रुक नहीं रही, या झागदार थूक
    - असामान्य नींद, उलझन, या उल्टी
  medical_follow_up:
    required: true
    reason: >-
      अंदर गया पानी घंटों बाद फेफड़ों में सूजन ला सकता है ("सेकेंडरी ड्राउनिंग"),
      इसलिए उसी दिन डॉक्टर की जांच ज़रूरी है।
  sources:
    - who_drowning
    - nhs_first_aid

critical:
  risk_level: CRITICAL
  summary: >-
    यह डूबने की इमरजेंसी है। अभी 112 या 108 पर कॉल करें। सांस न चल रही हो, तो
    तुरंत छाती दबाना शुरू करें और मदद आने तक रुकें नहीं।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: तुरंत मदद बुलाएं
      instruction: >-
        अभी 112 या 108 पर कॉल करें, या मदद करते हुए किसी और से कॉल करवाएं। फ़ोन
        स्पीकर पर रखें।
    - step: 2
      title: ख़ुद डूबे बिना बचाएं
      instruction: >-
        मरीज़ पानी में हो, तो लाठी या रस्सी बढ़ाएं या तैरने वाली चीज़ फेंकें।
        प्रशिक्षण न हो तो कूदें नहीं — बचाने वाले भी अक्सर डूब जाते हैं।
    - step: 3
      title: सांस जांचें
      instruction: >-
        सूखी ज़मीन पर, सिर हल्के से पीछे झुकाकर 10 सेकंड तक सांस जांचें।
    - step: 4
      title: सांस नहीं — सीपीआर शुरू करें
      instruction: >-
        छाती के बीच में ज़ोर से और तेज़ दबाएं, क़रीब हर सेकंड में दो बार। आता हो तो
        मुंह से सांस भी दें — डूबने में यह ख़ास ज़रूरी है। मदद आने तक जारी रखें।
    - step: 5
      title: सांस है — करवट लिटाएं
      instruction: >-
        सांस चल रही हो, तो करवट लिटाएं, गीले कपड़े उतारें, और ढककर गरम रखें। पास
        रहें और हर मिनट सांस दोबारा जांचें।
  do_not:
    - फेफड़ों से पानी दबाकर निकालने की कोशिश में समय बर्बाद न करें।
    - मरीज़ को सुखाने या गरमाने के लिए छाती दबाना न रोकें।
    - कुछ खाने या पीने को न दें।
  monitor:
    - सांस — शुरू होती है, रुकती है, या बदलती है
    - आवाज़ या छूने पर मरीज़ जवाब देता है या नहीं
    - शरीर का तापमान — ढककर गरम रखें
  medical_follow_up:
    required: true
    reason: >-
      डूबने से बचाए गए हर मरीज़ को अस्पताल में निगरानी चाहिए, बचाव सफल होने के
      बाद भी।
  sources:
    - who_drowning
    - nhs_first_aid
