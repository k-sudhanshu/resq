default:
  risk_level: URGENT
  summary: >-
    ठंडा रखें और ज़्यादा पिलाएँ। 3 महीने से छोटे शिशु का बुखार, अकड़ी गर्दन,
    बैंगनी दाने, या दौरा आपात है।
  emergency:
    call_112: false
    call_108: false
  immediate_actions:
    - step: 1
      title: हल्के कपड़े, हवादार कमरा
      instruction: >-
        अतिरिक्त कंबल और जैकेट हटाएँ। कमरा खुला रखें। कसकर न लपेटें।
    - step: 2
      title: बार-बार पिलाएँ
      instruction: >-
        पानी, ओआरएस, या माँ का दूध छोटे घूँट में दें। बुखार में पानी खर्च होता है।
    - step: 3
      title: बहुत गरम हों तो गुनगुना पोंछें
      instruction: >-
        चेहरा, गर्दन, हाथ-पैर गुनगुने (बर्फ़ जैसे ठंडे नहीं) कपड़े से पोंछें।
    - step: 4
      title: डॉक्टर को दिखाएँ
      instruction: >-
        बुखार तेज़ हो, 2–3 दिन से ज़्यादा हो, या बुज़ुर्ग/गर्भवती हों तो उसी दिन सलाह लें।
  do_not:
    - बर्फ़ के टब या शराब से मालिश न करें।
    - बच्चे को एस्पिरिन न दें।
    - “पसीना निकल जाए” सोचकर कई कंबल न ओढ़ाएँ।
  monitor:
    - गर्दन अकड़ना, बैंगनी दाने, दौरा
    - पीना या जागना मुश्किल
    - तेज़ या भारी सांस
  medical_follow_up:
    required: true
    reason: >-
      बुखार मलेरिया, डेंगू, या संक्रमण हो सकता है। जाँच और इलाज डॉक्टर तय करें।
  sources:
    - mohfw_india
    - nhs_first_aid

critical:
  risk_level: CRITICAL
  summary: >-
    छोटे शिशु का बुखार, दौरा, अकड़ी गर्दन, या बैंगनी दाने पर अभी 112 या 108।
    सांस खुली रखें, खाना न दें।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: अभी मदद बुलाएँ
      instruction: >-
        112 या 108 पर कॉल करें। उम्र और ख़तरे का संकेत बताएँ (दौरा, दाने, 3 महीने से छोटा, जगाना मुश्किल)।
    - step: 2
      title: दौरा पड़े तो
      instruction: >-
        सिर बचाएँ, झटके रुकें तो करवट करें, मुँह में कुछ न डालें।
    - step: 3
      title: धीरे ठंडा करें
      instruction: >-
        अतिरिक्त कपड़े हटाएँ। गुनगुना कपड़ा लगाएँ। बर्फ़ न लगाएँ।
    - step: 4
      title: पूरी तरह जागें तभी घूँट
      instruction: >-
        पूरी तरह जाग रहे हों तो पानी के घूँट दें। ऊँघ रहे हों तो मुँह से कुछ न दें।
  do_not:
    - बच्चों को एस्पिरिन न दें।
    - दौरे में मुँह में चम्मच या उंगली न डालें।
    - ख़तरे के संकेत हों तो बुखार “उतरने” का इंतज़ार न करें।
  monitor:
    - दोबारा दौरा
    - सांस
    - जगाया जा सकता है या नहीं
  medical_follow_up:
    required: true
    reason: >-
      ये संकेत गंभीर संक्रमण हो सकते हैं। तुरंत अस्पताल में जाँच चाहिए।
  sources:
    - mohfw_india
    - nhs_first_aid
