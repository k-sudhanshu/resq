default:
  risk_level: URGENT
  summary: >-
    आंख न रगड़ें। ढीली चीज़ हो तो साफ़ पानी से धोएँ। रसायन, फँसी चीज़, या
    दिखना बंद होना आपात है।
  emergency:
    call_112: false
    call_108: false
  immediate_actions:
    - step: 1
      title: रगड़ें नहीं
      instruction: >-
        रगड़ने से न कहें। रगड़ने से आंख खरोंच सकती है।
    - step: 2
      title: ढीली चीज़ धोएँ
      instruction: >-
        सिर झुकाएँ ताकि घायल आंख नीचे रहे। अंदर के कोने से बाहर की तरफ़ कई मिनट साफ़ पानी डालें।
    - step: 3
      title: ढीला ढकें
      instruction: >-
        धोने से फ़र्क न पड़े तो साफ़ कप या धुंध से हल्का ढकें — दबाएँ नहीं।
    - step: 4
      title: आज ही डॉक्टर को दिखाएँ
      instruction: >-
        दर्द, लालिमा, या धुंधला दिखना रहे तो उसी दिन जाँच कराएँ।
  do_not:
    - आंख के गोले में धँसी चीज़ न निकालें।
    - तेल, दूध, या बची आंख की दवाई न डालें।
    - गंदा कपड़ा न पोंछें।
  monitor:
    - दिखना बिगड़ना
    - दर्द बढ़ना या रोशनी से तकलीफ़
    - आंख में खून
  medical_follow_up:
    required: true
    reason: >-
      हल्की लगने वाली चोट भी नज़र ख़तरे में डाल सकती है। उसी दिन जाँच सबसे सुरक्षित है।
  sources:
    - nhs_first_aid
    - indian_red_cross

critical:
  risk_level: CRITICAL
  summary: >-
    आंख में रसायन, फँसी चीज़, या अचानक दिखना बंद — आपात है। रसायन अभी धोएँ
    और 112 या 108 पर कॉल करें।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: रसायन — पहले धोएँ, फिर कॉल
      instruction: >-
        आंख खुली रखकर कम से कम 15 मिनट अंदर के कोने से बाहर साफ़ पानी डालें, ताकि दूसरी आंख में न जाए। फिर 112 या 108।
    - step: 2
      title: फँसी चीज़ — न निकालें
      instruction: >-
        वहीं रहने दें। दोनों आंखें ढीली ढकें ताकि घायल आंख हिले नहीं। मदद बुलाएँ।
    - step: 3
      title: कटी या पिचकी आंख
      instruction: >-
        ज़ोर से न धोएँ। ढीला ढकें और तुरंत अस्पताल जाएँ।
    - step: 4
      title: शांत बैठाएँ
      instruction: >-
        सिर स्थिर रखकर बैठाएँ। आंख कसकर न मूँदने दें।
  do_not:
    - तेज़ाब-क्षार को दूसरी रसायन से “काटने” की कोशिश न करें।
    - आंख के गोले पर दबाव न डालें।
    - धँसी चीज़ न निकालें।
  monitor:
    - दिखना
    - तेज़ दर्द
    - चोट के बाद उल्टी जैसा लगना
  medical_follow_up:
    required: true
    reason: >-
      रसायन और धँसी चोट कुछ घंटों में आंख ख़राब कर सकती है।
  sources:
    - nhs_first_aid
    - indian_red_cross
