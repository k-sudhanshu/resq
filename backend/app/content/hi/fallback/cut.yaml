default:
  risk_level: URGENT
  summary: >-
    खून रोकने के लिए घाव पर कसकर दबाएं, फिर उसे साफ़ करके ढक दें। गहरा या गंदा घाव
    डॉक्टर को दिखाना चाहिए।
  emergency:
    call_112: false
    call_108: false
  immediate_actions:
    - step: 1
      title: घाव पर दबाव डालें
      instruction: >-
        साफ़ कपड़े या पैड से घाव पर कसकर दबाएं और कम से कम 10 मिनट तक दबाए रखें —
        बीच में देखने के लिए न हटाएं।
    - step: 2
      title: चोट वाले हिस्से को ऊपर उठाएं
      instruction: >-
        अगर चोट हाथ या पैर पर है, तो दबाव बनाए रखते हुए उसे दिल के स्तर से ऊपर
        उठाकर रखें।
    - step: 3
      title: खून रुकने पर घाव साफ़ करें
      instruction: >-
        घाव को साफ़ बहते पानी से धो लें। रगड़ें नहीं।
    - step: 4
      title: घाव को ढक दें
      instruction: >-
        साफ़ पट्टी या ड्रेसिंग से घाव ढक दें। गीली या गंदी हो जाए तो बदल दें।
    - step: 5
      title: देखें कि डॉक्टर की ज़रूरत है या नहीं
      instruction: >-
        अगर घाव गहरा या खुला है, जंग लगी या गंदी चीज़ से लगा है, या टिटनेस का टीका
        5 साल से ज़्यादा पुराना है, तो डॉक्टर को दिखाएं।
  do_not:
    - जब तक खून बह रहा है, घाव देखने के लिए पैड न हटाएं।
    - घाव में फंसी किसी चीज़ को बाहर न खींचें।
    - घाव पर राख, हल्दी या कोई पाउडर न लगाएं।
    - खून रोकने के लिए हाथ-पैर पर कुछ कसकर न बांधें।
  monitor:
    - पट्टी के आर-पार खून निकलना
    - मरीज़ का पीला पड़ना, ठंडा होना, सुस्त होना या पसीना आना
    - अगले दिनों में लाली, सूजन, पीब या बुख़ार बढ़ना
  medical_follow_up:
    required: true
    reason: >-
      गहरे घाव में टांके, सफ़ाई या टिटनेस के टीके की ज़रूरत हो सकती है, जो सिर्फ़
      क्लिनिक में हो सकता है।
  sources:
    - nhs_first_aid
    - indian_red_cross

critical:
  risk_level: CRITICAL
  summary: >-
    तेज़ खून बहने में तुरंत आपातकालीन मदद चाहिए। 112 या 108 पर कॉल करें और मदद आने
    तक घाव पर ज़ोर से दबाव बनाए रखें।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: तुरंत मदद बुलाएं
      instruction: >-
        अभी 112 या 108 पर कॉल करें और फ़ोन स्पीकर पर लगा लें ताकि दोनों हाथ खाली
        रहें।
    - step: 2
      title: ज़ोर से दबाएं और रुकें नहीं
      instruction: >-
        कपड़े, साफ़ पैड या अपने हाथ से घाव पर ज़ोर से दबाएं। मदद आने तक लगातार दबाव
        बनाए रखें।
    - step: 3
      title: ऊपर से और पैड लगाएं
      instruction: >-
        खून पैड के आर-पार निकलने लगे तो उसके ऊपर दूसरा पैड रखें और दबाते रहें।
        पहला पैड न हटाएं।
    - step: 4
      title: लिटाएं और अंग ऊपर उठाएं
      instruction: >-
        मरीज़ को सीधा लिटा दें। अगर घाव हाथ या पैर पर है, तो दबाव बनाए रखते हुए उसे
        ऊपर उठाकर रखें।
    - step: 5
      title: गरम रखें और हिलने न दें
      instruction: >-
        चादर या जैकेट से ढक दें और एम्बुलेंस आने तक उससे बात करते रहें।
  do_not:
    - घाव देखने के लिए पैड न हटाएं।
    - घाव में फंसी किसी चीज़ को बाहर न खींचें।
    - कुछ खाने या पीने को न दें।
    - मरीज़ को उठने या चलने-फिरने न दें।
  monitor:
    - मरीज़ होश में है और जवाब दे पा रहा है या नहीं
    - सांस तेज़ या उखड़ी हुई होना
    - त्वचा पीली, स्लेटी, ठंडी या चिपचिपी पड़ना
  medical_follow_up:
    required: true
    reason: >-
      इतना खून बहने पर अस्पताल में जांच ज़रूरी है, और ऑपरेशन या खून चढ़ाने की ज़रूरत
      पड़ सकती है।
  sources:
    - nhs_first_aid
    - indian_red_cross
