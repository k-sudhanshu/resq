default:
  risk_level: URGENT
  summary: >-
    गर्भावस्था की समस्या का उसी दिन क्लिनिक या अस्पताल में इलाज ज़रूरी है।
    उन्हें बाईं करवट लिटाएँ, चाहें तो घूँट पानी दें, और जाने में देर न करें।
  emergency:
    call_112: false
    call_108: false
  immediate_actions:
    - step: 1
      title: बाईं करवट लिटाएँ
      instruction: >-
        घुटने हल्के मोड़कर बाईं करवट लिटाएँ। इससे बच्चे तक खून बेहतर जाता है।
    - step: 2
      title: जो दिखे उसे याद रखें
      instruction: >-
        खून, पानी, दर्द का समय, और बच्चा कैसे हिल रहा है — यह बात क्लिनिक में बताएँ।
    - step: 3
      title: अस्पताल या दाई के पास जाएँ
      instruction: >-
        अभी निकटतम अस्पताल या प्रशिक्षित दाई के पास जाएँ। दर्द “रुक जाए” इसका इंतज़ार न करें।
    - step: 4
      title: गरम और शांत रखें
      instruction: >-
        तंग कपड़े ढीले करें, गरम रखें, साथ रहें। पूरी तरह जाग रही हों और उल्टी न हो तो घूँट पानी दें।
  do_not:
    - कोई दवाई, जड़ी-बूटी, या “घर पर डिलीवरी” की दवा न दें।
    - पेट न दबाएँ और बच्चे को न खींचें।
    - खून बह रहा हो या तेज़ दर्द हो तो लंबी पैदल सैर न कराएँ।
  monitor:
    - खून बढ़ना
    - दौरा, तेज़ सिरदर्द, या कम जागना
    - बच्चे का हिलना बंद होना
  medical_follow_up:
    required: true
    reason: >-
      माँ और बच्चे की जाँच सिर्फ़ क्लिनिक में हो सकती है। खून या कम हलचल में देर ख़तरनाक है।
  sources:
    - mohfw_india
    - nhs_first_aid

critical:
  risk_level: CRITICAL
  summary: >-
    यह गर्भावस्था की आपात स्थिति है। अभी 112 या 108 पर कॉल करें। बाईं करवट
    लिटाएँ, दवाई न दें।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: अभी मदद बुलाएँ
      instruction: >-
        112 या 108 पर कॉल करें और कहें गर्भवती को खून, दौरा, या बच्चा नहीं हिल रहा। फ़ोन स्पीकर पर रखें।
    - step: 2
      title: बाईं करवट, घुटने मुड़े
      instruction: >-
        बाईं करवट लिटाएँ। दौरा पड़े तो चोट से बचाएँ, मुँह में कुछ न डालें।
    - step: 3
      title: अगर बच्चा आ रहा हो
      instruction: >-
        सिर दिख रहा हो तो शांत रहें, बच्चे को सहारा दें, खींचें नहीं। जन्म के बाद बच्चे को माँ की छाती पर गरम रखें।
    - step: 4
      title: खून पर पैड — अंदर कुछ न ठूँसें
      instruction: >-
        खून हो तो बाहर साफ़ कपड़े का पैड लगाएँ। योनि के अंदर कुछ न डालें।
    - step: 5
      title: मदद आने तक साथ रहें
      instruction: >-
        गरम रखें। खाना न दें। लक्षण कब शुरू हुए नोट करें।
  do_not:
    - खून रोकने के लिए गोली या देसी दवा न दें।
    - बच्चे को न खींचें और बिना ट्रेनिंग नाल न काटें, जब तक मदद बहुत दूर न हो।
    - चक्कर आए तो देर तक सीधा न बैठाएँ।
  monitor:
    - खून कितना है
    - जाग रही हैं या नहीं
    - सांस और दोबारा दौरा
  medical_follow_up:
    required: true
    reason: >-
      गर्भावस्था में खून, दौरा, या प्रसव की समस्या का इलाज तुरंत अस्पताल में होना चाहिए।
  sources:
    - mohfw_india
    - nhs_first_aid
