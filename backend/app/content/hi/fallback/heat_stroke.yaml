# Structure must mirror content/en/fallback/heat_stroke.yaml exactly.
# Only the display text is translated.
default:
  risk_level: URGENT
  summary: >-
    मरीज़ को छांव में ले जाएं, पानी और पंखे से ठंडा करें, और घूंट-घूंट पानी या
    ओआरएस दें। 30 मिनट में सुधार न हो, या उलझन दिखे, तो इसे इमरजेंसी मानें।
  emergency:
    call_112: false
    call_108: false
  immediate_actions:
    - step: 1
      title: गर्मी से बाहर निकालें
      instruction: >-
        मरीज़ को तुरंत छांव या ठंडे कमरे में ले जाएं। लिटा दें और पैर थोड़े ऊपर उठा
        दें।
    - step: 2
      title: कपड़े ढीले करें और ठंडा करें
      instruction: >-
        कसे कपड़े ढीले कर दें। शरीर को ठंडे पानी से पोंछें, या गीले कपड़े गर्दन,
        बगल और जांघ के जोड़ पर रखें। लगातार पंखा करें।
    - step: 3
      title: घूंट-घूंट तरल दें
      instruction: >-
        मरीज़ पूरी तरह होश में हो, तो पानी, ओआरएस, या नमक-चीनी वाला नींबू पानी
        दें। छोटे घूंट, बार-बार।
    - step: 4
      title: 30 मिनट नज़र रखें
      instruction: >-
        ठंडा करते रहें और देखते रहें। 30 मिनट में बेहतर लगने लगना चाहिए। न लगे, या
        हालत बिगड़े, तो आपातकालीन मदद लें।
  do_not:
    - शराब, चाय या कॉफ़ी न दें।
    - मरीज़ को धूप में या खड़ी गाड़ी में अकेला न छोड़ें।
    - पूरे शरीर पर अचानक बर्फ़ जैसा ठंडा पानी न डालें।
  monitor:
    - उलझन होना या ज़बान लड़खड़ाना
    - त्वचा बहुत गरम और सूखी होना, पसीना बंद हो जाना
    - उल्टी होना, या पानी न पी पाना
  medical_follow_up:
    required: true
    reason: >-
      गर्मी की थकावट बढ़कर लू (हीटस्ट्रोक) बन सकती है। जिसे ठंडा करना पड़ा हो, उसे
      डॉक्टर को दिखाएं — ख़ासकर बच्चों और बुज़ुर्गों को।
  sources:
    - nhs_first_aid
    - mohfw_india

critical:
  risk_level: CRITICAL
  summary: >-
    यह लू (हीटस्ट्रोक) लगती है — शरीर का ख़ुद को ठंडा करना बंद हो गया है। यह
    जानलेवा हो सकती है। अभी 112 या 108 पर कॉल करें और इंतज़ार करते हुए मरीज़ को
    तेज़ी से ठंडा करें।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: तुरंत मदद बुलाएं
      instruction: >-
        अभी 112 या 108 पर कॉल करें और बताएं कि लू लगी है। फ़ोन स्पीकर पर रखें।
    - step: 2
      title: तेज़ी से ठंडा करें
      instruction: >-
        छांव में ले जाएं। शरीर पर ठंडा पानी डालें, गीली चादर ओढ़ाएं, और ज़ोर से
        पंखा करें। गीले कपड़े गर्दन, बगल और जांघ के जोड़ पर रखें।
    - step: 3
      title: सुरक्षित स्थिति में लिटाएं
      instruction: >-
        बेहोश हो पर सांस चल रही हो, तो करवट लिटा दें। होश में हो, तो सीधा लिटाकर
        पैर थोड़े ऊपर कर दें।
    - step: 4
      title: मदद आने तक ठंडा करते रहें
      instruction: >-
        ठंडा करना बंद न करें। एंबुलेंस आने तक गीले कपड़े बदलते रहें और पंखा करते
        रहें।
  do_not:
    - उलझन या सुस्ती हो तो कुछ पीने को न दें।
    - पैरासिटामोल या एस्पिरिन न दें — लू में ये काम नहीं करतीं।
    - मरीज़ कांपने लगे या ठीक लगने लगे, तब भी ठंडा करना बंद न करें।
  monitor:
    - सांस, और मरीज़ होश में रह रहा है या नहीं
    - शरीर की गर्मी — त्वचा ठंडी हो रही है या नहीं
    - कोई दौरा या उल्टी
  medical_follow_up:
    required: true
    reason: >-
      लू दिमाग़, किडनी और दिल को नुक़सान पहुंचाती है। मरीज़ संभलता दिखे, तब भी
      अस्पताल का इलाज ज़रूरी है।
  sources:
    - nhs_first_aid
    - mohfw_india
