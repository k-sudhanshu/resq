# Structure must mirror content/en/fallback/animal_bite.yaml exactly.
# Only the display text is translated.
default:
  risk_level: URGENT
  summary: >-
    काटी जगह को साबुन और बहते पानी से 15 मिनट धोएं, ढक दें, और रेबीज़ से बचाव के
    लिए डॉक्टर से मिलें — भारत में कुत्ते, बिल्ली या बंदर का हर काटा, छोटा भी,
    डॉक्टर को दिखाना ज़रूरी है।
  emergency:
    call_112: false
    call_108: false
  immediate_actions:
    - step: 1
      title: घाव को अच्छी तरह धोएं
      instruction: >-
        काटी जगह को साबुन लगाकर बहते पानी के नीचे पूरे 15 मिनट धोएं। रेबीज़ से
        बचाव का यह सबसे ज़रूरी क़दम है।
    - step: 2
      title: एंटीसेप्टिक लगाएं
      instruction: >-
        धोने के बाद, पोविडोन-आयोडीन जैसा एंटीसेप्टिक मिले तो लगा दें।
    - step: 3
      title: खून रोकें
      instruction: >-
        साफ़ कपड़े से घाव को दबाएं, जब तक खून रुक न जाए।
    - step: 4
      title: ढीला ढक दें
      instruction: >-
        साफ़ कपड़े या ढीली पट्टी से ढक दें। घाव को कसकर बंद या सिलवाने की जल्दी न
        करें।
    - step: 5
      title: आज ही डॉक्टर से मिलें
      instruction: >-
        उसी दिन डॉक्टर या स्वास्थ्य केंद्र जाकर रेबीज़ के टीके की सलाह और टिटनेस
        का इंजेक्शन लें। जानवर की जानकारी साथ ले जाएं।
  do_not:
    - घाव पर मिर्च, चूना, हल्दी, तेल या राख न लगाएं।
    - छोटे काटे या खरोंच को नज़रअंदाज़ न करें — रेबीज़ उससे भी हो सकता है।
    - जानवर स्वस्थ दिखे, फिर भी रेबीज़ का टीका टालें नहीं।
  monitor:
    - अगले दिनों में लाली, सूजन, मवाद, या बुख़ार बढ़ना
    - जानवर पर नज़र, अगर पता हो — 10 दिन में बीमार पड़े या मरे तो बताएं
    - काटी जगह से सुन्नपन या झनझनाहट फैलना
  medical_follow_up:
    required: true
    reason: >-
      रेबीज़ के टीके और टिटनेस का फ़ैसला डॉक्टर को करना है। लक्षण शुरू होने के बाद
      रेबीज़ लगभग हमेशा जानलेवा है, पर समय पर टीके से पूरी तरह बचाव मुमकिन है।
  sources:
    - who_animal_bites
    - mohfw_india

critical:
  risk_level: CRITICAL
  summary: >-
    गहरे या कई घावों में आपातकालीन इलाज चाहिए। 112 या 108 पर कॉल करें, घाव को
    ज़ोर से दबाकर खून रोकें, और मदद आने तक मरीज़ को स्थिर रखें।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: तुरंत मदद बुलाएं
      instruction: >-
        अभी 112 या 108 पर कॉल करें। फ़ोन स्पीकर पर रखें ताकि हाथ मदद के लिए खाली
        रहें।
    - step: 2
      title: खून पर ज़ोर से दबाव डालें
      instruction: >-
        साफ़ कपड़े से घाव को मज़बूती से दबाएं। कपड़ा भीग जाए तो पहले वाले को हटाए
        बिना ऊपर दूसरा कपड़ा रखें।
    - step: 3
      title: मरीज़ को लिटा दें
      instruction: >-
        उसे लिटा दें और हो सके तो खून बहने वाला अंग ऊपर उठा दें। गरम और शांत
        रखें।
    - step: 4
      title: हल्के घाव धो सकें तो धोएं
      instruction: >-
        खून क़ाबू में हो, तो इंतज़ार करते हुए हल्के घावों को साबुन और बहते पानी से
        15 मिनट धीरे-धीरे धोएं।
    - step: 5
      title: मदद आने तक साथ रहें
      instruction: >-
        घाव पर दबाव बनाए रखें और एंबुलेंस आने तक मरीज़ के पास ही रहें।
  do_not:
    - खून से भीगा कपड़ा हटाएं नहीं — ऊपर और कपड़ा रखें।
    - घाव पर मिर्च, चूना, हल्दी, तेल या राख न लगाएं।
    - कुछ खाने या पीने को न दें।
  monitor:
    - दबाने से खून कम हो रहा है या नहीं
    - त्वचा पीली, ठंडी या चिपचिपी होना, या मरीज़ को चक्कर आना
    - मरीज़ होश में रह रहा है या नहीं
  medical_follow_up:
    required: true
    reason: >-
      गहरे काटों में अस्पताल में सफ़ाई, रेबीज़ और टिटनेस से बचाव, और कभी-कभी
      ऑपरेशन की ज़रूरत होती है।
  sources:
    - who_animal_bites
    - nhs_first_aid
