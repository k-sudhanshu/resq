# Structure must mirror content/en/fallback/chest_pain.yaml exactly.
# Only the display text is translated.
default:
  risk_level: URGENT
  summary: >-
    सीने के दर्द को कभी हल्के में न लें। मरीज़ को आराम कराएं, कोई मेहनत न करने
    दें, और आज ही जांच कराएं — दर्द कम हो जाए तब भी।
  emergency:
    call_112: false
    call_108: false
  immediate_actions:
    - step: 1
      title: हर काम रुकवाएं
      instruction: >-
        मरीज़ को तुरंत बैठाकर आराम कराएं, जिस स्थिति में आराम मिले — अक्सर पीठ के
        सहारे आधा बैठना ठीक रहता है।
    - step: 2
      title: कसे कपड़े ढीले करें
      instruction: >-
        कॉलर, बेल्ट और कसी चीज़ें ढीली कर दें। माहौल शांत रखें और खुली हवा दें।
    - step: 3
      title: दर्द पर बारीकी से नज़र रखें
      instruction: >-
        दर्द भारी या जकड़न वाला हो जाए, बांह, जबड़े या पीठ की ओर फैले, या पसीना या
        सांस फूलना साथ हो — तो तुरंत 112 या 108 पर कॉल करें।
    - step: 4
      title: आज ही जांच कराएं
      instruction: >-
        दर्द शांत हो जाए, तब भी उसी दिन डॉक्टर से मिलें। मरीज़ की चल रही दवाओं की
        सूची साथ ले जाएं।
  do_not:
    - मरीज़ को चलने, सीढ़ियां चढ़ने या गाड़ी चलाने न दें।
    - बिना जांच के दर्द को गैस या एसिडिटी मानकर टालें नहीं।
    - दर्द रहते मरीज़ को अकेला न छोड़ें।
  monitor:
    - दर्द भारी या जकड़न वाला होना, या फैलना
    - ठंडा पसीना, जी मिचलाना, सांस फूलना, या चक्कर
    - धड़कन अनियमित या बहुत तेज़ होना
  medical_follow_up:
    required: true
    reason: >-
      दिल का दर्द है या कुछ और, यह ईसीजी जैसी जांच ही बता सकती है। उसी दिन जांच
      कराना ही सुरक्षित रास्ता है।
  sources:
    - nhs_first_aid
    - indian_red_cross

critical:
  risk_level: CRITICAL
  summary: >-
    ये दिल के दौरे के लक्षण हो सकते हैं। अभी 112 या 108 पर कॉल करें। मरीज़ को आधा
    बैठाकर आराम कराएं, और उसे हिलने-डुलने न दें।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: तुरंत मदद बुलाएं
      instruction: >-
        अभी 112 या 108 पर कॉल करें और बताएं कि दिल का दौरा हो सकता है। फ़ोन
        स्पीकर पर रखें।
    - step: 2
      title: आधा बैठाकर आराम कराएं
      instruction: >-
        मरीज़ को ज़मीन या बिस्तर पर बैठाएं — घुटने मुड़े, पीठ और सिर को सहारा।
        इससे दिल पर ज़ोर कम पड़ता है।
    - step: 3
      title: एस्पिरिन, अगर आसानी से मिल जाए
      instruction: >-
        मरीज़ पूरे होश में हो, एस्पिरिन से एलर्जी न हो, और दवा पास में ही हो, तो एक
        बड़ों वाली एस्पिरिन (क़रीब 300 मि.ग्रा.) धीरे-धीरे चबाने को दें। दवा ढूंढने
        बाहर न जाएं।
    - step: 4
      title: शांत और स्थिर रखें
      instruction: >-
        कसे कपड़े ढीले करें, गरम रखें और हिम्मत बंधाएं। चलना, खाना, धूम्रपान — कुछ
        नहीं।
    - step: 5
      title: सीपीआर के लिए तैयार रहें
      instruction: >-
        मरीज़ जवाब देना बंद कर दे और सांस सामान्य न हो, तो छाती के बीच में ज़ोर से
        और तेज़ दबाना शुरू करें, और मदद आने तक जारी रखें।
  do_not:
    - मरीज़ को चलने या कोई भी मेहनत करने न दें।
    - खाना, पानी या दूसरी दवाएं न दें।
    - मदद बुलाने से पहले दर्द के गुज़रने का इंतज़ार न करें।
    - एंबुलेंस सच में न मिले, तभी ख़ुद गाड़ी से ले जाएं।
  monitor:
    - दर्द बदलता है, फैलता है, या कम होता है
    - सांस और त्वचा का रंग
    - मरीज़ होश में रह रहा है या नहीं
  medical_follow_up:
    required: true
    reason: >-
      दिल के दौरे में बंद नस खोलने का इलाज अस्पताल में तुरंत चाहिए — हर मिनट की
      देरी दिल को और नुक़सान पहुंचाती है।
  sources:
    - nhs_first_aid
    - indian_red_cross
