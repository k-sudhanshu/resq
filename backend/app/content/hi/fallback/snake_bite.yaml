# Structure must mirror content/en/fallback/snake_bite.yaml exactly.
# Only the display text is translated.
default:
  risk_level: URGENT
  summary: >-
    हर सांप के काटने को गंभीर मानें। मरीज़ को स्थिर रखें, काटा हुआ अंग दिल से नीचे
    रखें, और जितनी जल्दी हो सके ऐसे अस्पताल पहुंचें जहां एंटी-वेनम हो — भले ही
    काटा छोटा दिखे।
  emergency:
    call_112: false
    call_108: false
  immediate_actions:
    - step: 1
      title: मरीज़ को शांत और स्थिर रखें
      instruction: >-
        उसे बैठा दें या लिटा दें और जितना हो सके हिलने-डुलने न दें। हिलने-डुलने से
        ज़हर शरीर में तेज़ी से फैलता है।
    - step: 2
      title: काटा हुआ अंग नीचे और स्थिर रखें
      instruction: >-
        काटी हुई बांह या पैर को दिल के स्तर से नीचे रखें। टूटे अंग की तरह सहारा दें —
        कपड़े और लकड़ी की पट्टी से काम चल जाएगा।
    - step: 3
      title: कसी हुई चीज़ें उतार दें
      instruction: >-
        सूजन शुरू होने से पहले काटी जगह के पास की अंगूठी, चूड़ियां, घड़ी और कसे
        कपड़े उतार दें।
    - step: 4
      title: अभी अस्पताल जाएं
      instruction: >-
        मरीज़ को सबसे पास के ऐसे अस्पताल ले जाएं जहां एंटी-वेनम मिलता हो। सुरक्षित
        साधन न हो तो 108 पर एंबुलेंस बुलाएं।
    - step: 5
      title: समय और सांप की पहचान नोट करें
      instruction: >-
        काटने का समय याद रखें, और सांप दिखा हो तो उसका रंग और आकार। सांप का पीछा
        या उसे पकड़ने की कोशिश न करें।
  do_not:
    - घाव को काटें नहीं, मुंह से ज़हर न चूसें, और रस्सी या कसकर पट्टी न बांधें।
    - काटी जगह पर बर्फ़, जड़ी-बूटी, झाड़-फूंक की चीज़ें या पत्थर न लगाएं।
    - शराब, चाय, कॉफ़ी या मुंह से कोई दवा न दें।
    - घरेलू नुस्खों या झाड़-फूंक में समय बर्बाद न करें — सीधे अस्पताल जाएं।
  monitor:
    - सूजन का अंग में ऊपर की ओर बढ़ना, या त्वचा का काला पड़ना
    - पलकें झुकना, धुंधला दिखना, या बोलने-निगलने में दिक्कत
    - उल्टी, सुस्ती, या मसूड़ों या काटी जगह से खून आना
  medical_follow_up:
    required: true
    reason: >-
      एंटी-वेनम चाहिए या नहीं, यह सिर्फ़ अस्पताल तय कर सकता है। लक्षण काटने के
      घंटों बाद भी शुरू हो सकते हैं, इसलिए डॉक्टर की निगरानी ज़रूरी है।
  sources:
    - who_snakebite
    - nhs_first_aid

critical:
  risk_level: CRITICAL
  summary: >-
    ये ज़हर फैलने के लक्षण हैं। अभी 112 या 108 पर कॉल करें और मरीज़ को तुरंत ऐसे
    अस्पताल पहुंचाएं जहां एंटी-वेनम हो। उसे स्थिर रखें और करवट लिटाएं।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: तुरंत मदद बुलाएं
      instruction: >-
        अभी 112 या 108 पर कॉल करें और बताएं कि सांप ने काटा है। फ़ोन स्पीकर पर रखें
        ताकि हाथ खाली रहें।
    - step: 2
      title: करवट लिटाएं
      instruction: >-
        अगर मरीज़ सुस्त है या उल्टी हो रही है, तो उसे बाईं करवट लिटाएं ताकि सांस की
        नली साफ़ रहे। उसे अकेला न छोड़ें।
    - step: 3
      title: अंग को स्थिर और नीचे रखें
      instruction: >-
        काटा अंग दिल से नीचे और बिलकुल स्थिर रखें। हो सके तो किसी सीधी चीज़ और
        कपड़े से पट्टी बांधकर सहारा दें।
    - step: 4
      title: कसी हुई चीज़ें उतारें
      instruction: >-
        सूजन बढ़ने से पहले काटी जगह के पास की अंगूठी, चूड़ियां और कसे कपड़े हटा
        दें।
    - step: 5
      title: सांस पर नज़र रखें
      instruction: >-
        मदद आने तक मरीज़ के पास रहें और सांस देखते रहें। सांस रुक जाए और आपको
        आता हो, तो छाती दबाना (सीपीआर) शुरू करें।
  do_not:
    - घाव को काटें नहीं, ज़हर न चूसें, और रस्सी या कसकर पट्टी न बांधें।
    - कुछ खाने या पीने को न दें।
    - मरीज़ को चलने न दें, भले ही वह कहे कि चल सकता है।
    - अस्पताल जाने से पहले लक्षण ठीक होने का इंतज़ार न करें।
  monitor:
    - सांस, और यह कि मरीज़ अब भी बोल पा रहा है या नहीं
    - मरीज़ होश में रह रहा है या नहीं
    - मसूड़ों, नाक, या काटी जगह से नया खून आना
  medical_follow_up:
    required: true
    reason: >-
      ज़हरीले काटने में एंटी-वेनम और अस्पताल में निगरानी ज़रूरी है। देरी जान के लिए
      ख़तरा बन सकती है।
  sources:
    - who_snakebite
    - nhs_first_aid
