# Structure must mirror content/en/fallback/breathing.yaml exactly.
# Only the display text is translated.
default:
  risk_level: URGENT
  summary: >-
    मरीज़ को सीधा बैठाएं, शांत रखें, और इनहेलर हो तो लेने में मदद करें। सांस फूलना
    ठीक न हो रहा हो, तो आज ही डॉक्टर को दिखाएं।
  emergency:
    call_112: false
    call_108: false
  immediate_actions:
    - step: 1
      title: सीधा बैठाएं
      instruction: >-
        मरीज़ को बैठाएं, थोड़ा आगे झुका हुआ, बाहें मेज़ या घुटनों पर टिकी हुईं। उसे
        लिटाएं नहीं।
    - step: 2
      title: शांत रखें, हवा दें
      instruction: >-
        खिड़कियां खोलें, लोगों को पीछे करें, और कसे कपड़े ढीले करें। घबराहट से सांस
        और बिगड़ती है — धीरे और शांति से बात करें।
    - step: 3
      title: इनहेलर इस्तेमाल कराएं
      instruction: >-
        अस्थमा हो, तो राहत वाला इनहेलर (अक्सर नीला) लेने में मदद करें: एक बार में
        एक पफ़, ज़्यादा से ज़्यादा 10 पफ़, धीमी गहरी सांसों के साथ।
    - step: 4
      title: बोलने पर नज़र रखें
      instruction: >-
        मरीज़ एक बार में बस दो-चार शब्द बोल पा रहा हो, या 10 मिनट में इनहेलर से
        आराम न आए, तो 112 या 108 पर कॉल करें।
    - step: 5
      title: आज ही डॉक्टर को दिखाएं
      instruction: >-
        नई या बढ़ती हुई सांस फूलने की शिकायत उसी दिन डॉक्टर को दिखाएं, शांत हो
        जाने के बाद भी।
  do_not:
    - मरीज़ को सीधा लिटाएं नहीं।
    - उसके चारों ओर भीड़ न लगाएं और लगातार बुलवाएं नहीं।
    - दौरे के दौरान भाप या धुएं वाले घरेलू नुस्खे न आज़माएं।
  monitor:
    - बोलना कठिन होना — पूरे वाक्य या सिर्फ़ शब्द
    - होंठ या उंगलियों के सिरे नीले या राख जैसे पड़ना
    - सांस और तेज़, आवाज़दार, या मेहनत वाली होना
  medical_follow_up:
    required: true
    reason: >-
      वजह — अस्थमा, संक्रमण, दिल की परेशानी, या एलर्जी — डॉक्टर को ही पहचानकर
      इलाज करनी चाहिए।
  sources:
    - nhs_first_aid
    - indian_red_cross

critical:
  risk_level: CRITICAL
  summary: >-
    सांस की गंभीर तकलीफ़ इमरजेंसी है। अभी 112 या 108 पर कॉल करें। इंतज़ार करते
    हुए मरीज़ को सीधा बैठाए रखें और इनहेलर में मदद करें।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: तुरंत मदद बुलाएं
      instruction: >-
        अभी 112 या 108 पर कॉल करें और सांस की हालत बताएं। फ़ोन स्पीकर पर रखें
        ताकि हाथ खाली रहें।
    - step: 2
      title: सीधा बैठाए रखें
      instruction: >-
        मरीज़ को बैठाए रखें, थोड़ा आगे झुका हुआ। थका हुआ हो, तब भी लिटाएं नहीं।
    - step: 3
      title: अस्थमा हो तो इनहेलर
      instruction: >-
        राहत वाला इनहेलर लेने में मदद करें — एक बार में एक पफ़, ज़्यादा से ज़्यादा
        10 पफ़। एंबुलेंस न पहुंचे तो 10 मिनट बाद दोहराएं।
    - step: 4
      title: खाना, डंक या दवा के बाद सूजन
      instruction: >-
        चेहरा या गला सूज रहा हो, तो यह गंभीर एलर्जी हो सकती है। मरीज़ के पास
        एड्रेनालिन इंजेक्शन (ऑटो-इंजेक्टर) हो, तो तुरंत जांघ के बाहरी हिस्से पर
        लगाने में मदद करें।
    - step: 5
      title: साथ रहें और देखते रहें
      instruction: >-
        पास रहें, शांत रखें, और सांस देखते रहें। सांस रुक जाए, तो मदद आने तक छाती
        दबाना शुरू करें।
  do_not:
    - मरीज़ को लिटाएं नहीं और अकेला न छोड़ें।
    - सांस की गंभीर तकलीफ़ में कुछ खिलाएं-पिलाएं नहीं।
    - मदद बुलाने से पहले सुधार का इंतज़ार न करें।
  monitor:
    - मरीज़ बोल पा रहा है या नहीं, और एक बार में कितने शब्द
    - होंठ और चेहरे का रंग — नीला या राख जैसा ख़तरे की निशानी है
    - मरीज़ होश में रह रहा है या नहीं
  medical_follow_up:
    required: true
    reason: >-
      गंभीर दौरे में ऑक्सीजन, नेबुलाइज़ेशन और आपातकालीन दवाएं चाहिए, जो सिर्फ़
      अस्पताल दे सकता है।
  sources:
    - nhs_first_aid
    - indian_red_cross
