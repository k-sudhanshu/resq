# Structure must mirror content/en/fallback/head_injury.yaml exactly.
# Only the display text is translated.
default:
  risk_level: URGENT
  summary: >-
    गूमड़ पर ठंडी सिकाई करें और अगले 24 घंटे मरीज़ पर बारीकी से नज़र रखें। उल्टी,
    बढ़ता सिरदर्द, या असामान्य नींद दिखे — तो तुरंत अस्पताल।
  emergency:
    call_112: false
    call_108: false
  immediate_actions:
    - step: 1
      title: बैठाकर जांचें
      instruction: >-
        मरीज़ को आराम कराएं और देखें कि वह कैसे जवाब देता है। आसान सवाल पूछें —
        नाम, दिन, क्या हुआ था।
    - step: 2
      title: गूमड़ पर ठंडी सिकाई
      instruction: >-
        बर्फ़ या कोई ठंडी चीज़ कपड़े में लपेटकर सूजन पर रखें, एक बार में ज़्यादा से
        ज़्यादा 20 मिनट। बर्फ़ सीधे त्वचा पर कभी न रखें।
    - step: 3
      title: कटे पर हल्का दबाव
      instruction: >-
        खून बहते कट पर साफ़ कपड़ा दबाएं। सिर की त्वचा के छोटे कट से भी काफ़ी खून
        बहता है।
    - step: 4
      title: 24 घंटे आराम और निगरानी
      instruction: >-
        एक दिन आराम और निगरानी में रखें। रात में एक-दो बार जगाकर देखें कि वह
        सामान्य जवाब दे रहा है।
    - step: 5
      title: ख़तरे की निशानियां याद रखें
      instruction: >-
        उल्टी, बढ़ता सिरदर्द, उलझन, असामान्य नींद, या कान या नाक से तरल आए — तो
        तुरंत अस्पताल जाएं।
  do_not:
    - नींद की गोली, शराब, या तेज़ दर्द-निवारक न दें।
    - पहले कुछ घंटे मरीज़ को अकेला न छोड़ें।
    - आज उसे गाड़ी चलाने या भारी काम करने न दें।
  monitor:
    - उल्टी, बढ़ता सिरदर्द, या धुंधला दिखना
    - उलझन, लड़खड़ाती ज़बान, या असामान्य नींद
    - कान या नाक से खून या पानी जैसा तरल
  medical_follow_up:
    required: true
    reason: >-
      खोपड़ी के अंदर खून धीरे-धीरे भी रिस सकता है। अगले 24-48 घंटों में कोई भी
      ख़तरे की निशानी दिखे, तो तुरंत अस्पताल जाना ज़रूरी है।
  sources:
    - nhs_first_aid
    - indian_red_cross

critical:
  risk_level: CRITICAL
  summary: >-
    ये निशानियां खोपड़ी के अंदर खून रिसने की हो सकती हैं। अभी 112 या 108 पर कॉल
    करें। मरीज़ को स्थिर रखें, और खाने-पीने या बिना निगरानी सोने न दें।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: तुरंत मदद बुलाएं
      instruction: >-
        अभी 112 या 108 पर कॉल करें और बताएं कि चोट कैसे लगी। फ़ोन स्पीकर पर
        रखें।
    - step: 2
      title: सिर और गर्दन स्थिर रखें
      instruction: >-
        ऊंचाई से गिरने या सड़क हादसे के बाद गर्दन की चोट मानकर चलें। दोनों हाथों से
        सिर को स्थिर पकड़ें, और मरीज़ को मोड़ें या उठाएं नहीं।
    - step: 3
      title: बेहोश हो पर सांस चल रही हो
      instruction: >-
        सिर, गर्दन और रीढ़ को एक सीध में रखते हुए उसे धीरे से करवट लिटाएं — हो सके
        तो दो लोग मिलकर।
    - step: 4
      title: बिना ज़ोर लगाए खून रोकें
      instruction: >-
        बहते घाव पर साफ़ कपड़ा रखें। खोपड़ी टूटी होने का शक हो, तो घाव पर नहीं,
        सिर्फ़ उसके चारों ओर दबाएं।
    - step: 5
      title: मदद आने तक नज़र रखें
      instruction: >-
        जवाब देना, उल्टी, या दौरा — सब नोट करें और एंबुलेंस टीम को बताएं। सांस रुक
        जाए तो छाती दबाना शुरू करें।
  do_not:
    - मरीज़ को बेवजह हिलाएं नहीं, और खड़ा होकर चलने न दें।
    - खाना, पानी या दर्द की दवा न दें।
    - हेलमेट फंसा हो तो ज़बरदस्ती न निकालें — मदद का इंतज़ार करें।
    - खोपड़ी टूटी होने का शक हो, तो घाव पर ज़ोर से न दबाएं।
  monitor:
    - सांस, और मरीज़ होश में रह रहा है या नहीं
    - आंखों की पुतलियां — एक का दूसरी से बड़ा होना ख़तरे की निशानी है
    - उल्टी, दौरे, या कान या नाक से तरल आना
  medical_follow_up:
    required: true
    reason: >-
      खोपड़ी के अंदर खून रिसा है या नहीं, यह स्कैन से ही पता चलता है — और वह
      सिर्फ़ अस्पताल में हो सकता है।
  sources:
    - nhs_first_aid
    - indian_red_cross
