default:
  risk_level: URGENT
  summary: >-
    ज़हर के हर मामले में डॉक्टर की सलाह ज़रूरी है, चाहे मरीज़ ठीक लग रहा हो। उल्टी
    कराने की कोशिश न करें।
  emergency:
    call_112: false
    call_108: false
  immediate_actions:
    - step: 1
      title: उस चीज़ से दूर करें
      instruction: >-
        मरीज़ को खुली हवा में ले जाएं, धुएं या गिरे हुए केमिकल से दूर। केमिकल हो तो
        पहले अपनी सुरक्षा का ध्यान रखें।
    - step: 2
      title: डिब्बा या बोतल साथ रखें
      instruction: >-
        जो पैकेट, बोतल या पौधा हो उसे ढूंढकर साथ ले जाएं। डॉक्टर को ठीक-ठीक जानना
        ज़रूरी है कि क्या था।
    - step: 3
      title: मुंह या त्वचा धोएं
      instruction: >-
        निगला हो तो मुंह पानी से कुल्ला करा दें। त्वचा पर गिरा हो तो 15 मिनट तक
        बहते पानी से धोएं।
    - step: 4
      title: बैठाकर शांत रखें
      instruction: >-
        उसे चुपचाप बैठने दें और नज़र रखें। अगर वह ख़ुद उल्टी करे, तो सिर एक तरफ़ कर
        दें।
    - step: 5
      title: अभी डॉक्टर की सलाह लें
      instruction: >-
        उसे नज़दीकी अस्पताल ले जाएं, या 112 या 108 पर सलाह लें — चाहे वह ठीक ही लग
        रहा हो।
  do_not:
    - उल्टी कराने की कोशिश न करें।
    - ज़हर काटने के लिए दूध, नमक का पानी या कोई घरेलू नुस्ख़ा न दें।
    - अगर मरीज़ सुस्त है या सांस लेने में तकलीफ़ है, तो कुछ पीने को न दें।
    - लक्षण दिखने का इंतज़ार करके सलाह लेना न टालें।
  monitor:
    - सुस्त होना, कुछ समझ न पाना, या बेहोश होना
    - सांस धीमी, आवाज़ वाली या मुश्किल होना
    - बार-बार उल्टी, दौरे, या मुंह के आसपास जलन के निशान
  medical_follow_up:
    required: true
    reason: >-
      कुछ ज़हर कई घंटों बाद असर दिखाते हैं, इसलिए डॉक्टर को चीज़, मात्रा और समय की
      जांच करनी चाहिए।
  sources:
    - nhs_first_aid
    - mohfw_india

critical:
  risk_level: CRITICAL
  summary: >-
    यह आपातकालीन स्थिति है। अभी 112 या 108 पर कॉल करें और डिब्बा या बोतल अस्पताल
    साथ ले जाएं।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: तुरंत मदद बुलाएं
      instruction: >-
        अभी 112 या 108 पर कॉल करें। अगर पता है तो बताएं कि क्या लिया, कितना लिया,
        और कब लिया।
    - step: 2
      title: सुरक्षित तरीक़े से खुली हवा में लाएं
      instruction: >-
        ख़ुद को ख़तरे में डाले बिना मरीज़ को धुएं या केमिकल से दूर करें। दरवाज़े और
        खिड़कियां खोल दें।
    - step: 3
      title: करवट पर लिटाएं
      instruction: >-
        अगर वह सुस्त या बेहोश है पर सांस चल रही है, तो उसे करवट पर लिटा दें और सिर
        थोड़ा नीचे की ओर रखें ताकि उल्टी बाहर निकल सके।
    - step: 4
      title: सांस पर लगातार नज़र रखें
      instruction: >-
        अगर सांस सामान्य रूप से चलना बंद हो जाए, तो छाती के बीच ज़ोर से और तेज़ी से
        दबाना (CPR) शुरू करें।
    - step: 5
      title: डिब्बा साथ भेजें
      instruction: >-
        पैकेट, बोतल या पौधे का नमूना एम्बुलेंस के साथ भेजें ताकि अस्पताल ज़हर पहचान
        सके।
  do_not:
    - उल्टी कराने की कोशिश न करें।
    - ज़हर काटने के लिए दूध, नमक का पानी या कोई घरेलू नुस्ख़ा न दें।
    - सुस्त या बेहोश मरीज़ को मुंह से कुछ न दें।
    - उसे पीठ के बल सीधा लेटा हुआ न छोड़ें।
  monitor:
    - सांस की रफ़्तार, और वह आवाज़ वाली होना या रुक जाना
    - होश का स्तर, और उसे जगाया जा सकता है या नहीं
    - दौरे पड़ना, या होंठ और उंगलियों का नीला पड़ना
  medical_follow_up:
    required: true
    reason: >-
      इस स्तर के ज़हर में अस्पताल में इलाज, निगरानी और ज़रूरत पड़ने पर एंटीडोट देना
      पड़ता है।
  sources:
    - nhs_first_aid
    - mohfw_india
