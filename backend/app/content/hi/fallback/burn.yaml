# Structure must mirror content/en/fallback/burn.yaml exactly.
# Only the display text is translated.
default:
  risk_level: URGENT
  summary: >-
    जली हुई जगह को बहते पानी के नीचे ठंडा करें और साफ़ रखें। अगर छाले पड़ गए हैं,
    जलन हथेली से बड़ी है, या चेहरे, हाथ, पैर या जोड़ पर है, तो डॉक्टर को दिखाएं।
  emergency:
    call_112: false
    call_108: false
  immediate_actions:
    - step: 1
      title: जलना रोकें
      instruction: >-
        मरीज़ को गर्मी या आग से दूर करें। जली जगह के पास के गरम कपड़े, गहने या घड़ी
        धीरे से हटा दें, पर जो चीज़ त्वचा से चिपक गई हो उसे न छेड़ें।
    - step: 2
      title: बहते पानी से ठंडा करें
      instruction: >-
        जली जगह को 20 मिनट तक ठंडे बहते पानी के नीचे रखें। अगर जलने के बाद कुछ समय
        बीत गया हो, तब भी यह करें।
    - step: 3
      title: शरीर को गरम रखें
      instruction: >-
        जली जगह को छोड़कर बाकी शरीर पर चादर या सूखा कपड़ा डाल दें, ताकि ठंडा करते
        समय मरीज़ को ठंड न लगे।
    - step: 4
      title: घाव को ढीला ढक दें
      instruction: >-
        ठंडा करने के बाद जली जगह पर साफ़ क्लिंग फ़िल्म रखें, या ऐसा साफ़ कपड़ा लगाएं
        जिसके रेशे न छूटें। कसकर न बांधें।
    - step: 5
      title: डॉक्टर को दिखाएं
      instruction: >-
        अगर छाले पड़े हैं, जलन हथेली से बड़ी है, या चेहरे, हाथ, पैर या जोड़ पर है, तो
        मरीज़ को डॉक्टर या अस्पताल ले जाएं।
  do_not:
    - जली जगह पर टूथपेस्ट, मक्खन, घी, तेल, हल्दी या राख न लगाएं।
    - ठंडा करने के लिए बर्फ़ या बहुत ठंडे पानी का इस्तेमाल न करें।
    - छालों को न फोड़ें।
    - जली त्वचा से चिपके कपड़े को खींचकर न निकालें।
  monitor:
    - सांस लेने में तकलीफ़ होना, या आवाज़ बैठ जाना
    - जली जगह में दर्द, सूजन बढ़ना या बदबू आना
    - बुख़ार आना, या मरीज़ का सुस्त और भ्रमित होना
  medical_follow_up:
    required: true
    reason: >-
      डॉक्टर को देखना ज़रूरी है कि जलन कितनी गहरी है और टिटनेस का टीका या ड्रेसिंग
      चाहिए या नहीं।
  sources:
    - who_burns
    - nhs_first_aid

critical:
  risk_level: CRITICAL
  summary: >-
    इस जलन में तुरंत आपातकालीन मदद चाहिए। 112 या 108 पर कॉल करें और इंतज़ार करते
    समय जली जगह ठंडा करना शुरू करें।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: तुरंत मदद बुलाएं
      instruction: >-
        अभी 112 या 108 पर कॉल करें। फ़ोन स्पीकर पर लगा लें ताकि आपके हाथ मदद करने
        के लिए खाली रहें।
    - step: 2
      title: सुरक्षित तरीक़े से आग से दूर करें
      instruction: >-
        मरीज़ को गर्मी से दूर करें, पर सिर्फ़ तब जब यह आपके लिए सुरक्षित हो। जलते या
        धुएं से भरे कमरे में ख़ुद न जाएं।
    - step: 3
      title: सांस का ध्यान रखें
      instruction: >-
        अगर सांस लेने में तकलीफ़ है या आवाज़ बैठी हुई है, तो मरीज़ को सीधा बैठाकर रखें
        और गले और छाती के कसे कपड़े ढीले कर दें।
    - step: 4
      title: इंतज़ार करते समय ठंडा करें
      instruction: >-
        जली जगह पर 20 मिनट तक ठंडा बहता पानी डालें। बाकी शरीर को ढककर गरम रखें।
    - step: 5
      title: ढकें और साथ रहें
      instruction: >-
        जली जगह पर साफ़ क्लिंग फ़िल्म या साफ़ कपड़ा रखें, और मदद आने तक मरीज़ के पास
        ही रहें।
  do_not:
    - जली जगह पर टूथपेस्ट, मक्खन, घी, तेल, हल्दी या राख न लगाएं।
    - ठंडा करने के लिए बर्फ़ या बहुत ठंडे पानी का इस्तेमाल न करें।
    - सांस लेने में तकलीफ़ हो तो कुछ खाने या पीने को न दें।
    - मदद बुलाने से पहले यह देखने का इंतज़ार न करें कि जलन ठीक हो रही है या नहीं।
  monitor:
    - सांस, और यह कि मरीज़ साफ़ बोल पा रहा है या नहीं
    - मरीज़ होश में रह रहा है या नहीं
    - त्वचा ठंडी और चिपचिपी होना, या कंपकंपी आना
  medical_follow_up:
    required: true
    reason: >-
      इतनी गंभीर जलन में अस्पताल में इलाज ज़रूरी है — पानी की कमी पूरी करने, दर्द
      कम करने और घाव की देखभाल के लिए।
  sources:
    - who_burns
    - nhs_first_aid
