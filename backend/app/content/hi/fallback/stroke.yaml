default:
  risk_level: CRITICAL
  summary: >-
    स्ट्रोक की आशंका हमेशा आपात है। अभी 112 या 108 पर कॉल करें। शुरू होने का
    समय याद रखें। खाना, पानी, या एस्पिरिन न दें।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: अभी मदद बुलाएँ
      instruction: >-
        112 या 108 पर कॉल करें और कहें शायद स्ट्रोक है। कब शुरू हुआ बताएँ।
    - step: 2
      title: शांत और सहारे से रखें
      instruction: >-
        सिर थोड़ा ऊँचा रखकर बैठाएँ या लिटाएँ। चलने न दें।
    - step: 3
      title: कपड़े ढीले करें
      instruction: >-
        कॉलर और तंग चीज़ें ढीली करें। साथ रहें, शांत रखें।
    - step: 4
      title: अगर बेहोश हों
      instruction: >-
        पूरी तरह जाग न रहे हों तो करवट पर लिटाएँ ताकि सांस खुली रहे — गर्दन की चोट न हो तब।
  do_not:
    - खाना, पानी, या दवाई न दें — निगलना असुरक्षित हो सकता है।
    - डॉक्टर बिना एस्पिरिन न दें।
    - “चल जाएगा” सोचकर इंतज़ार न करें।
  monitor:
    - चेहरा, बाँह, बोल बिगड़ना
    - जाग रहे हैं या नहीं
    - सांस
  medical_follow_up:
    required: true
    reason: >-
      स्ट्रोक का इलाज पहले घंटों में सबसे असरदार है। अस्पताल ही सुरक्षित अगला कदम है।
  sources:
    - nhs_first_aid
    - mohfw_india

critical:
  risk_level: CRITICAL
  summary: >-
    चेहरा लटकना, कमज़ोर बाँह, या लड़खड़ाती बोली हो तो तुरंत 112 या 108। मुँह
    से कुछ न दें।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: अभी 112 या 108
      instruction: >-
        लक्षण कब शुरू हुए और FAST संकेत (चेहरा, बाँह, बोल) बताएँ।
    - step: 2
      title: सिर सहारा दें
      instruction: >-
        सिर और कंधे थोड़े ऊँचे रखें। खड़े या चलने न दें।
    - step: 3
      title: मुँह से कुछ नहीं
      instruction: >-
        पानी, चाय, खाना, गोली कुछ न दें। गला सही काम नहीं कर रहा हो सकता है।
    - step: 4
      title: ज़रूरत हो तो करवट
      instruction: >-
        जवाब न दें लेकिन सांस चल रही हो तो करवट पर पलटें।
    - step: 5
      title: सीपीआर के लिए तैयार रहें
      instruction: >-
        सामान्य सांस बंद हो तो छाती दबाएँ जब तक मदद न आए।
  do_not:
    - संदिग्ध स्ट्रोक में खुद से एस्पिरिन न दें।
    - एम्बुलेंस हो तो खुद गाड़ी न चलाएँ।
    - अकेले न छोड़ें।
  monitor:
    - कमज़ोरी या बोल बिगड़ना
    - जवाब देना
    - सांस
  medical_follow_up:
    required: true
    reason: >-
      अस्पताल में थक्का घोलने वाली दवा तभी मिलती है जब व्यक्ति जल्दी पहुँचे।
  sources:
    - nhs_first_aid
    - mohfw_india
