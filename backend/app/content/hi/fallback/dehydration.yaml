default:
  risk_level: URGENT
  summary: >-
    ओआरएस या साफ़ पानी छोटे-छोटे घूँट में दें। शिशु, बुज़ुर्ग, या कुछ पच न
    रहा हो तो उसी दिन क्लिनिक जाएँ।
  emergency:
    call_112: false
    call_108: false
  immediate_actions:
    - step: 1
      title: ओआरएस शुरू करें
      instruction: >-
        पैकेट के हिसाब से ओआरएस मिलाएँ, न हो तो साफ़ पानी दें। हर कुछ मिनट एक घूँट — एक साथ गिलास न पिलाएँ।
    - step: 2
      title: देते रहें
      instruction: >-
        कई घंटे जारी रखें। उल्टी हो तो 10 मिनट रुककर फिर छोटे घूँट दें।
    - step: 3
      title: छाया में आराम
      instruction: >-
        ठंडा और शांत रखें। शिशु को ओआरएस के साथ माँ का दूध भी जारी रखें।
    - step: 4
      title: डॉक्टर के पास जाएँ
      instruction: >-
        पेशाब बहुत कम हो, आंखें धँसी हों, या कुछ पच न रहा हो तो क्लिनिक जाएँ।
  do_not:
    - सिर्फ़ ठंडे शीतल पेय या तेज़ चाय न दें।
    - स्तनपान न रोकें।
    - डॉक्टर बिना दस्त की दवाई न दें।
  monitor:
    - पेशाब कितनी बार
    - ऊँघ या ठंडे हाथ
    - उल्टी जारी
  medical_follow_up:
    required: true
    reason: >-
      गंभीर कमी में क्लिनिक में नस से पानी चढ़ता है। संकेत बिगड़ें तो घर का ओआरएस काफ़ी नहीं।
  sources:
    - mohfw_india
    - nhs_first_aid

critical:
  risk_level: CRITICAL
  summary: >-
    पीने लायक नहीं, बहुत ऊँघ रहे हैं, या कई घंटे पेशाब नहीं। 112 या 108। मुँह
    में ज़बरदस्ती पानी न डालें।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: अभी मदद बुलाएँ
      instruction: >-
        112 या 108 पर कॉल करें और कहें पानी की कमी है और पी नहीं सकते।
    - step: 2
      title: ज़बरदस्ती न पिलाएँ
      instruction: >-
        ऊँघ रहे हों तो मुँह में पानी न डालें — दम घुट सकता है।
    - step: 3
      title: ठंडा करें और लिटाएँ
      instruction: >-
        छाया में लिटाएँ, कपड़े ढीले करें, चक्कर आए और जाग रहे हों तो पैर ऊँचे करें।
    - step: 4
      title: पूरी तरह जागें तभी घूँट
      instruction: >-
        पूरी तरह जागकर निगल सकें तो इंतज़ार में ओआरएस के छोटे घूँट दें।
  do_not:
    - एक साथ बहुत पानी न पिलाएँ।
    - अंदाज़े से नमक-पानी न बनाएँ।
    - शिशु या बुज़ुर्ग को “सोने दो” कहकर न छोड़ें।
  monitor:
    - जवाब देना
    - सांस
    - पेशाब हुआ या नहीं
  medical_follow_up:
    required: true
    reason: >-
      पानी की कमी से शॉक में अस्पताल का तरल चाहिए। शिशु और बुज़ुर्गों में देर ख़तरनाक है।
  sources:
    - mohfw_india
    - nhs_first_aid
