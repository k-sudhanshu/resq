# Structure must mirror content/en/fallback/electric_shock.yaml exactly.
# Only the display text is translated.
default:
  risk_level: URGENT
  summary: >-
    मरीज़ को छूने से पहले बिजली ज़रूर बंद करें। घर के छोटे झटके के बाद भी डॉक्टर से
    जांच कराएं — करंट बाहर निशान छोड़े बिना भी दिल को नुक़सान पहुंचा सकता है।
  emergency:
    call_112: false
    call_108: false
  immediate_actions:
    - step: 1
      title: पहले बिजली बंद करें
      instruction: >-
        मरीज़ को छूने से पहले मेन स्विच बंद करें या प्लग निकालें। न कर पाएं तो सूखी
        लकड़ी, प्लास्टिक या कपड़े से उसे स्रोत से दूर धकेलें — नंगे हाथ कभी नहीं।
    - step: 2
      title: हालत देखें
      instruction: >-
        सुरक्षित होने पर देखें कि मरीज़ होश में है और सांस सामान्य है। उसे बैठाकर
        आराम कराएं।
    - step: 3
      title: जले को ठंडा करें
      instruction: >-
        जलने का निशान हो, तो उसे 20 मिनट बहते पानी से ठंडा करें और साफ़ कपड़े से
        ढीला ढक दें।
    - step: 4
      title: जांच कराएं
      instruction: >-
        मरीज़ ठीक लगे तब भी डॉक्टर को दिखाएं — करंट का असर धड़कन पर घंटों बाद भी
        आ सकता है।
  do_not:
    - बिजली का स्रोत बंद हुए बिना मरीज़ को न छुएं।
    - करंट से जले पर मरहम, घी या टूथपेस्ट न लगाएं।
    - निशान नहीं दिखता, इसलिए सब ठीक है — ऐसा न मानें।
  monitor:
    - धड़कन अनियमित या बहुत तेज़ लगना, या सीने में दर्द
    - चक्कर, उलझन, या कमज़ोरी
    - जली जगह में दर्द या सूजन बढ़ना
  medical_follow_up:
    required: true
    reason: >-
      करंट दिल और अंदर के ऊतकों को बिना दिखे नुक़सान पहुंचा सकता है, इसलिए सच में
      झटका लगा हो तो डॉक्टर की जांच ज़रूरी है।
  sources:
    - nhs_first_aid
    - indian_red_cross

critical:
  risk_level: CRITICAL
  summary: >-
    यह बिजली की इमरजेंसी है। बिजली बंद हुए बिना मरीज़ को न छुएं। अभी 112 या 108
    पर कॉल करें — हाई-वोल्टेज या आसमानी बिजली की चोट, या बेहोश मरीज़ को तुरंत
    आपातकालीन इलाज चाहिए।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: छुएं नहीं — बिजली बंद करें
      instruction: >-
        घर के करंट में मेन स्विच बंद करें। बिजली की लाइन, खंभे या ट्रांसफ़ॉर्मर से
        लगा हो तो कम से कम 18 मीटर (60 फ़ीट) दूर रहें और बिजली विभाग को फ़ोन करें —
        उसे सिर्फ़ वही सुरक्षित कर सकते हैं।
    - step: 2
      title: तुरंत मदद बुलाएं
      instruction: >-
        अभी 112 या 108 पर कॉल करें और बताएं कि बिजली का झटका लगा है। फ़ोन स्पीकर
        पर रखें।
    - step: 3
      title: सुरक्षित होने पर सांस देखें
      instruction: >-
        बिजली बंद होने के बाद ही: मरीज़ की सांस सामान्य न चल रही हो, तो छाती के बीच
        में ज़ोर से और तेज़ दबाना शुरू करें, और मदद आने तक जारी रखें।
    - step: 4
      title: सुरक्षित स्थिति में लिटाएं
      instruction: >-
        सांस चल रही हो पर होश न हो, तो उसे धीरे से करवट लिटा दें। ढककर गरम रखें।
    - step: 5
      title: इंतज़ार में जले ठंडे करें
      instruction: >-
        मरीज़ होश में हो, तो जले निशानों पर बहता पानी डालें और ढीला ढक दें।
        एंबुलेंस आने तक साथ रहें।
  do_not:
    - जब तक मरीज़ करंट से जुड़ा हो सकता है, उसे न छुएं।
    - गिरी हुई बिजली की तार के पास न जाएं, मदद के लिए भी नहीं।
    - कुछ खाने या पीने को न दें।
    - मरीज़ ठीक लगने लगे, तब भी उसे अकेला न छोड़ें।
  monitor:
    - सांस, और वह नियमित रह रही है या नहीं
    - मरीज़ होश में रह रहा है या नहीं
    - धड़कन अनियमित, बहुत तेज़, या बहुत धीमी लगना
  medical_follow_up:
    required: true
    reason: >-
      हाई-वोल्टेज झटके और आसमानी बिजली से धड़कन की गड़बड़ी और गहरे जले हो सकते
      हैं, जिनका इलाज सिर्फ़ अस्पताल में है।
  sources:
    - nhs_first_aid
    - indian_red_cross
