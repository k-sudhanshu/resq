default:
  risk_level: URGENT
  summary: >-
    चोट वाले हिस्से को हिलने न दें और सहारा देकर रखें, और एक्स-रे करवाएं। हड्डी को
    ख़ुद सीधा करने की कोशिश न करें।
  emergency:
    call_112: false
    call_108: false
  immediate_actions:
    - step: 1
      title: चोट वाले हिस्से को हिलने न दें
      instruction: >-
        मरीज़ से कहें कि हिले-डुले नहीं। चोट वाले हाथ या पैर को उसी स्थिति में सहारा
        देकर रखें जिसमें वह है।
    - step: 2
      title: सहारे के लिए कपड़े लगाएं
      instruction: >-
        मुड़े हुए कपड़े, तौलिया या तकिए चोट वाले हिस्से के आसपास रखें ताकि वह हिले
        नहीं। कुछ न हो तो हाथ से सहारा दें।
    - step: 3
      title: सूजन कम करें
      instruction: >-
        कपड़े में लपेटी ठंडी पट्टी 20 मिनट तक चोट पर रखें। बर्फ़ सीधे त्वचा पर कभी
        न लगाएं।
    - step: 4
      title: घाव हो तो ढक दें
      instruction: >-
        अगर चोट के ऊपर त्वचा कटी है, तो हड्डी पर दबाव डाले बिना उसे साफ़ पट्टी से
        ढक दें।
    - step: 5
      title: अस्पताल पहुंचें
      instruction: >-
        एक्स-रे के लिए अस्पताल जाने का इंतज़ाम करें। रास्ते में भी चोट वाले हिस्से को
        सहारा देकर रखें।
  do_not:
    - हड्डी को सीधा करने या अंदर धकेलने की कोशिश न करें।
    - चोट वाली जगह की मालिश न करें, और गरमाहट या तेल न लगाएं।
    - कुछ खाने-पीने को न दें, क्योंकि ऑपरेशन की ज़रूरत पड़ सकती है।
    - चोट वाले पैर पर वज़न डालकर चलने न दें।
  monitor:
    - चोट के नीचे की उंगलियों का ठंडा, नीला या सुन्न होना
    - दर्द या सूजन तेज़ी से बढ़ना
    - मरीज़ को चक्कर आना, सुस्ती या बहुत पीला पड़ना
  medical_follow_up:
    required: true
    reason: >-
      फ़्रैक्चर की पुष्टि सिर्फ़ एक्स-रे से होती है, और टूटी हड्डी को डॉक्टर द्वारा
      बैठाना और बांधना ज़रूरी है।
  sources:
    - nhs_first_aid
    - indian_red_cross

critical:
  risk_level: CRITICAL
  summary: >-
    इस चोट में तुरंत आपातकालीन मदद चाहिए। 112 या 108 पर कॉल करें और मरीज़ को हिलाएं
    नहीं, जब तक कोई ख़तरा न हो।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: तुरंत मदद बुलाएं
      instruction: >-
        अभी 112 या 108 पर कॉल करें। बताएं कि चोट कहां है और मरीज़ होश में है या नहीं।
    - step: 2
      title: मरीज़ को हिलाएं नहीं
      instruction: >-
        मरीज़ को वहीं रहने दें, ख़ासकर गर्दन, रीढ़, सिर, कूल्हे या जांघ की चोट में।
        सिर्फ़ तब हिलाएं जब वहां रहना ख़तरनाक हो।
    - step: 3
      title: सिर और गर्दन को सहारा दें
      instruction: >-
        अगर गर्दन या रीढ़ की चोट का शक है, तो सिर को शरीर की सीध में हल्के से थामे
        रखें और मरीज़ से कहें कि सिर न हिलाए।
    - step: 4
      title: खून बह रहा हो तो रोकें
      instruction: >-
        घाव के आसपास साफ़ कपड़े से दबाव डालें। अगर हड्डी दिख रही है, तो उसके किनारे
        दबाएं, सीधे हड्डी पर कभी नहीं।
    - step: 5
      title: गरम रखें और साथ रहें
      instruction: >-
        चादर या जैकेट से ढक दें, पास ही रहें, और एम्बुलेंस आने तक बात करते रहें।
  do_not:
    - हाथ-पैर को सीधा करने या हड्डी अंदर धकेलने की कोशिश न करें।
    - गर्दन या रीढ़ की चोट के शक में मरीज़ को हिलाएं नहीं।
    - कुछ खाने या पीने को न दें।
    - अगर हेलमेट पहना है तो उसे न उतारें।
  monitor:
    - मरीज़ होश में है और जवाब दे पा रहा है या नहीं
    - सांस तेज़, उखड़ी हुई या आवाज़ के साथ चलना
    - चोट के नीचे का हिस्सा ठंडा, नीला या सुन्न होना
  medical_follow_up:
    required: true
    reason: >-
      ऐसी चोटों से खून की नसें, नाड़ियां या रीढ़ को नुक़सान हो सकता है, इसलिए तुरंत
      अस्पताल में जांच ज़रूरी है।
  sources:
    - nhs_first_aid
    - indian_red_cross
