default:
  risk_level: URGENT
  summary: >-
    जब तक मरीज़ ज़ोर से खांस पा रहा है, उसे खांसने दें। उसके पास रहें और तैयार रहें
    कि खांसी कमज़ोर पड़ने पर तुरंत मदद करनी है।
  emergency:
    call_112: false
    call_108: false
  immediate_actions:
    - step: 1
      title: खांसने दें
      instruction: >-
        उसे ज़ोर से खांसते रहने के लिए कहें। तेज़ खांसी रुकावट को किसी भी तरीक़े से
        बेहतर निकालती है।
    - step: 2
      title: आगे झुकने में मदद करें
      instruction: >-
        उससे कहें कि थोड़ा आगे झुक जाए और सीधा खड़ा या बैठा रहे।
    - step: 3
      title: उसके पास रहें
      instruction: >-
        उसे अकेला न छोड़ें। ध्यान से देखते रहें कि खांसी कमज़ोर या बंद हो रही है या
        नहीं।
    - step: 4
      title: मदद के लिए तैयार रहें
      instruction: >-
        अगर वह खांस, बोल या सांस नहीं ले पा रहा, तो तुरंत पीठ पर थपकी और पेट पर
        झटके देना शुरू करें और 112 या 108 पर कॉल करें।
    - step: 5
      title: बाद में जांच करवाएं
      instruction: >-
        रुकावट निकल जाने के बाद भी, अगर दर्द, खांसी या निगलने में तकलीफ़ बनी रहे तो
        डॉक्टर को दिखाएं।
  do_not:
    - जो व्यक्ति ठीक से खांस पा रहा है, उसकी पीठ पर न मारें।
    - मुंह में उंगली डालकर अंदाज़े से चीज़ ढूंढने की कोशिश न करें।
    - दम घुटते समय पीने के लिए पानी न दें।
    - मदद बुलाने के लिए उसे अकेला छोड़कर न जाएं।
  monitor:
    - खांसी कमज़ोर, धीमी या बंद होना
    - होंठ, चेहरा या उंगलियों का नीला या स्लेटी पड़ना
    - मरीज़ का सुस्त होना या गिर जाना
  medical_follow_up:
    required: true
    reason: >-
      दम घुटना रुकने के बाद भी लक्षण बने रहें, तो डॉक्टर को चोट या अंदर बची चीज़ की
      जांच करनी चाहिए।
  sources:
    - nhs_first_aid
    - indian_red_cross

critical:
  risk_level: CRITICAL
  summary: >-
    सांस की नली बंद है। अभी 112 या 108 पर कॉल करें और तुरंत पीठ पर थपकी और पेट पर
    झटके देना शुरू करें।
  emergency:
    call_112: true
    call_108: true
  immediate_actions:
    - step: 1
      title: तुरंत मदद बुलाएं
      instruction: >-
        अभी 112 या 108 पर कॉल करें, या किसी और को कॉल करने के लिए कहें और ख़ुद मदद
        शुरू करें।
    - step: 2
      title: पीठ पर 5 थपकी दें
      instruction: >-
        मरीज़ को आगे झुकाएं। हथेली के निचले हिस्से से दोनों कंधों के बीच 5 बार ज़ोर
        से मारें।
    - step: 3
      title: पेट पर 5 झटके दें
      instruction: >-
        पीछे खड़े होकर मुट्ठी नाभि से थोड़ा ऊपर रखें, दूसरे हाथ से पकड़ें, और 5 बार
        तेज़ी से अंदर और ऊपर की ओर खींचें। 1 साल से छोटे शिशु के साथ यह न करें।
    - step: 4
      title: 1 साल से छोटे शिशु के लिए
      instruction: >-
        शिशु को अपनी बांह पर पेट के बल लिटाएं। पीठ पर 5 थपकी दें, फिर सीधा करके दो
        उंगलियों से छाती के बीच 5 बार दबाएं।
    - step: 5
      title: अगर बेहोश हो जाए
      instruction: >-
        उसे ज़मीन पर लिटा दें और छाती के बीच ज़ोर से और तेज़ी से दबाना (CPR) शुरू
        करें, मदद आने तक जारी रखें।
  do_not:
    - 1 साल से छोटे शिशु के पेट पर झटके न दें।
    - मुंह में उंगली डालकर अंदाज़े से चीज़ ढूंढने की कोशिश न करें।
    - कुछ खाने या पीने को न दें।
    - यह देखने के लिए न रुकें कि रुकावट अपने आप निकल जाएगी।
  monitor:
    - हवा अंदर-बाहर जा रही है या नहीं
    - होंठ और चेहरे का नीला या स्लेटी पड़ना
    - मरीज़ होश में रह रहा है या नहीं
  medical_follow_up:
    required: true
    reason: >-
      जिसे पेट या छाती पर झटके दिए गए हों, उसकी अस्पताल में अंदरूनी चोट की जांच
      ज़रूरी है।
  sources:
    - nhs_first_aid
    - indian_red_cross
