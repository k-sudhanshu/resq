questions:
  - id: poisoning_responsiveness
    text: मरीज़ अभी कैसा व्यवहार कर रहा है?
    options:
      - id: alert_and_normal
        text: होश में है और सामान्य लग रहा है
        escalates_to: URGENT
      - id: drowsy_or_confused
        text: सुस्त है, कुछ समझ नहीं पा रहा, या बार-बार उल्टी कर रहा है
        escalates_to: CRITICAL
      - id: unresponsive_or_seizing
        text: जवाब नहीं दे रहा, या दौरे पड़ रहे हैं
        escalates_to: CRITICAL
  - id: poisoning_breathing
    text: क्या उसकी सांस सामान्य चल रही है?
    options:
      - id: breathing_normal
        text: सांस सामान्य चल रही है
      - id: breathing_difficult
        text: सांस लेने में तकलीफ़ है, या सांस बहुत धीमी है
        escalates_to: CRITICAL
  - id: poisoning_substance
    text: उसने क्या निगला, सूंघा, या छुआ है?
    options:
      - id: medicine_overdose
        text: दवा ज़्यादा मात्रा में
        escalates_to: URGENT
      - id: cleaning_or_chemical
        text: साफ़-सफ़ाई का सामान, तेज़ाब, या कोई केमिकल
        escalates_to: URGENT
      - id: pesticide
        text: कीटनाशक, या चूहे-कीड़े मारने की दवा
        escalates_to: CRITICAL
      - id: plant_or_spoiled_food
        text: कोई पौधा, मशरूम, या ख़राब खाना
        escalates_to: URGENT
      - id: unknown_substance
        text: पता नहीं क्या था
        escalates_to: URGENT
  - id: poisoning_time
    text: यह कब हुआ?
    options:
      - id: within_last_hour
        text: पिछले एक घंटे के अंदर
      - id: more_than_hour_ago
        text: एक घंटे से ज़्यादा पहले
      - id: time_unknown
        text: ठीक से पता नहीं
