# The deployment target is Python 3.9 (macOS system Python locally, slim
# images in production), so PEP 604 unions are avoided in annotations that
# Pydantic evaluates at runtime.
target-version = "py39"
line-length = 88

# Autogenerated migrations are left as Alembic writes them. `extend-exclude`
# keeps ruff's built-in excludes (.venv and friends) in place.
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
  # Pydantic and FastAPI both rely on calls in default arguments.
  "B008",
  # Would rewrite Optional[X] to X | None, which breaks on Python 3.9.
  "UP007",
]

[lint.per-file-ignores]
# Tests set environment variables before importing the app, so imports cannot
# all sit at the top of the file.
"tests/conftest.py" = ["E402"]
