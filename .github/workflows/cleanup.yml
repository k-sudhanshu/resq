name: Cleanup expired data

# TTL enforcement lives here rather than in a background thread, because the
# free backend instance sleeps when idle and cannot be relied on to wake itself.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete expired sessions and analyses
        run: |
          curl --fail --silent --show-error \
            -X POST "${{ secrets.API_BASE_URL }}/api/v1/internal/cleanup" \
            -H "X-Internal-Secret: ${{ secrets.INTERNAL_SECRET }}"
